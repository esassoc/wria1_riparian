    function AcreStackBar({ sel, wria, title, attr, display = v => v }) {
      const total = sel.reduce((a, b) => a + b.acres, 0);
      const wTotal = wria ? wria.reduce((a, b) => a + b.acres, 0) : 0;

      // Colour must key off the CATEGORY, never the row's position. `sel` and
      // `wria` come back from statsByCat independently sorted by their own area
      // (ORDER BY SUM(sqft) DESC), so their orderings routinely differ — e.g.
      // filtering to salmon-bearing reaches ranks tiers P3,P2,P4,P1,P5 while the
      // WRIA-wide ranking is P5,P3,P4,P2,P1. Colouring by index would paint the
      // same swatch on different tiers in the solid and ghost bars, so the ghost
      // comparison would silently compare the wrong categories.
      // One map, built from the union of both key sets in a stable order.
      // Plain const rather than useMemo: this is a leaf component rendered in a
      // list, and adding a hook here would be one more thing to keep in order.
      const keyOrder = [...sel.map(r => r.key)];
      (wria || []).forEach(r => { if (!keyOrder.includes(r.key)) keyOrder.push(r.key); });
      const colorMap = new Map(keyOrder.map(k => [k, colorOf(attr, k)]));

      // The ghost is also re-ordered to the solid bar's key order, so the two
      // strips line up segment-for-segment and can be read against each other.
      const inSelOrder = rows => {
        const byKey = new Map(rows.map(r => [r.key, r]));
        return keyOrder.map(k => byKey.get(k)).filter(Boolean);
      };

      const seg = (rows, tot) => rows.map(r => ({
        key: r.key, pct: tot ? r.acres / tot * 100 : 0,
        color: colorMap.get(r.key) || '#9ca3af', acres: r.acres,
      }));
      const light = isLightChipColor;
      const bar = (segs, h, ghost) => (
        <div style={{ display: 'flex', height: h, borderRadius: 3, overflow: 'hidden', gap: 2, background: ghost ? 'none' : THEME.line2 }}>
          {segs.map(s => ghost
            ? <i key={s.key} style={{ display: 'block', width: `${s.pct}%`, border: `1px solid ${THEME.ghost}`, borderRadius: 2 }} title={`WRIA · ${display(s.key)}: ${s.pct.toFixed(1)}%`} />
            : <i key={s.key} className={light(s.color) ? 'lt' : ''} title={`${display(s.key)}: ${fmtAcres(s.acres)} acres (${s.pct.toFixed(1)}%)`}
                style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', font: '500 10.5px var(--font-m)',
                  color: light(s.color) ? THEME.ink : '#fff', background: s.color, width: `${s.pct}%`, overflow: 'hidden', whiteSpace: 'nowrap' }}>
                {s.pct >= 8 ? `${display(s.key)} ${s.pct.toFixed(0)}%` : ''}
              </i>)}
        </div>
      );
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', fontSize: 12, fontWeight: 600, color: THEME.ink2, marginBottom: 4 }}>
            <span>{title}</span><span className="num" style={{ fontWeight: 400, color: THEME.muted }}>{fmtAcres(total)} acres</span>
          </div>
          {bar(seg(sel, total), 22, false)}
          {wria && <div style={{ marginTop: 3 }}>{bar(seg(inSelOrder(wria), wTotal), 5, true)}</div>}
          <LegendRow style={{ marginTop: 5 }} items={seg(sel, total).filter(s => s.pct >= 1).map(s => ({ label: display(s.key), color: s.color }))} />
        </div>
      );
    }

    function BIDQueryPanel({ data, sharedBidData, appliedFilters, setAppliedFilters }) {
      const db = sharedBidData?.db || null;
      const bidLoading = !db;

      // --- helpers ---
      const toggleItem = (set, setter, item) => {
        const next = new Set(set);
        next.has(item) ? next.delete(item) : next.add(item);
        setter(next);
      };
      const toggleAll = (labels, set, setter) => {
        setter(set.size === labels.length ? new Set() : new Set(labels));
      };

      // A labelled chip group. `attr` picks the canonical colours; `display` maps raw -> shown text.
      function FilterGroup({ title, labels, attr, selected, setSelected, display = v => v, term }) {
        const light = isLightChipColor;
        return (
          <div>
            <div className="fl">
              <span>{term ? <Term id={term}>{title}</Term> : title}</span>
              <button type="button" onClick={() => toggleAll(labels, selected, setSelected)}>{selected.size === labels.length ? 'None' : 'All'}</button>
            </div>
            <div className="chips">
              {labels.map(lbl => {
                const on = selected.has(lbl), c = colorOf(attr, lbl);
                return <Chip key={lbl} on={on} off={!on} lt={on && light(c)} color={c} onClick={() => toggleItem(selected, setSelected, lbl)}>{display(lbl)}</Chip>;
              })}
            </div>
          </div>
        );
      }

      // --- SQL-backed label sets (DISTINCT queries, run once) ---
      const labelSets = React.useMemo(() => {
        if (!dbReady(db)) return {};
        const getDistinct = (col, where = "") => {
          const filter = where ? ` AND ${where}` : "";
          const r = db.exec(`SELECT DISTINCT ${col} FROM bids WHERE ${col} IS NOT NULL AND ${col} != ''${filter} ORDER BY ${col}`);
          return r.length ? r[0].values.map(v => String(v[0])) : [];
        };
        return {
          tier: getDistinct('tier'), chk: getDistinct('chk'),
          fish: getDistinct('fish'),
          srz: getDistinct('srz'), mgr: getDistinct('mgr'),
          zon: getDistinct('zon'), bfw: getDistinct('bfw'),
          hmz: ['N', 'Y'], sal: ['N', 'Y'],
          tcat: getDistinct('tic', 'ti=1'),
          fcat: getDistinct('fic', 'fi=1'),
          scat: getDistinct('sic', 'si=1'),
          species: SALMON_SPECIES,
        };
      }, [db]);

      const totalBidCount = React.useMemo(() => sqlBidCount(db), [db]);

      // --- Categorical filter state ---
      const [selTier, setSelTier] = React.useState(null);  // null until labelSets loads
      const [selChk, setSelChk] = React.useState(null);
      const [selFish, setSelFish] = React.useState(null);
      const [selSrz, setSelSrz] = React.useState(null);
      const [selMgr, setSelMgr] = React.useState(null);
      const [selZon, setSelZon] = React.useState(null);
      const [selBfw, setSelBfw] = React.useState(null);
      const [selHmz, setSelHmz] = React.useState(null);
      const [selSal, setSelSal] = React.useState(null);    // Salmon presence (Y/N)
      const [selSpecies, setSelSpecies] = React.useState(null);  // Salmon species multi-select
      const [selTcat, setSelTcat] = React.useState(null);  // Temperature impairment cat
      const [selFcat, setSelFcat] = React.useState(null);  // Fecal impairment cat
      const [selScat, setSelScat] = React.useState(null);  // Sediment impairment cat
      const [selWT, setSelWT] = React.useState(null);      // Waterbody type (Active Channel / Trib / Lake)
      const WT_LABELS = ['Active Channel', 'Tributary', 'Lake'];
      const [selBufZone, setSelBufZone] = React.useState(() => new Set([0, 1, 2, 3, 4]));
      const bufZoneLabels = ['0\u201350 ft', '50\u2013100 ft', '100\u2013300 ft', 'HMZ', 'HMZ+300'];
      const toggleBufZone = (idx) => {
        if (idx === 0) return;
        const next = new Set(selBufZone);
        if (next.has(idx)) { next.delete(idx); }
        else { next.add(idx); if (idx === 2 && !next.has(1)) next.add(1); }
        setSelBufZone(next);
      };

      // --- Range filter state ---
      // Declared before the rehydration effect below, which assigns to these
      // setters. React defers effects until after the body runs, so declaring
      // them after would happen to work — but only by timing, and a refactor
      // that moved this logic into render would turn it into a TDZ error.
      const [rRPF, setRRPF] = React.useState([0, 100]);
      const [rRPA, setRRPA] = React.useState([0, 100]);
      const [rComp, setRComp] = React.useState([-1, 1]);
      const [rCH, setRCH] = React.useState([0, 300]);
      const [rSol, setRSol] = React.useState([0, 12]);
      const [rSlp, setRSlp] = React.useState([0, 5]);
      const [rWet, setRWet] = React.useState([0, 5]);
      const [rPF, setRPF] = React.useState([0, 100]);
      const [rPS, setRPS] = React.useState([0, 100]);
      const [rPH, setRPH] = React.useState([0, 100]);
      const [rRest, setRRest] = React.useState([0, 100]);
      const [rCI, setRCI] = React.useState([0, 100]);
      // Show/hide the 3 landcover-share range sliders in Restoration Metrics.
      // Declared here (not beside the render below) because hooks must not sit
      // after the panel's early `return`s (bidLoading / !selTier).
      const [moreRanges, setMoreRanges] = React.useState(false);

      // Init filter sets once labels are known.
      // If appliedFilters already exists (panel is remounting after a tab
      // switch, or App restored it some other way), rehydrate the draft
      // state FROM appliedFilters instead of resetting to all-selected —
      // otherwise the chips/sliders would silently contradict the results
      // still shown below them. Sets/arrays are always copied so editing
      // the draft can never mutate appliedFilters in place.
      //
      // appliedFilters is read here but deliberately NOT in the dependency
      // array: this rehydrates once per mount. Adding it would re-fire the
      // effect on every Apply click, stomping the user's in-progress edits.
      React.useEffect(() => {
        if (!labelSets.tier) return;
        const f = appliedFilters;
        setSelTier(prev => prev || new Set(f ? f.selTier : labelSets.tier));
        setSelChk(prev => prev || new Set(f ? f.selChk : labelSets.chk));
        setSelFish(prev => prev || new Set(f ? f.selFish : labelSets.fish));
        setSelSrz(prev => prev || new Set(f ? f.selSrz : labelSets.srz));
        setSelMgr(prev => prev || new Set(f ? f.selMgr : labelSets.mgr));
        setSelZon(prev => prev || new Set(f ? f.selZon : labelSets.zon));
        setSelBfw(prev => prev || new Set(f ? f.selBfw : labelSets.bfw));
        setSelHmz(prev => prev || new Set(f ? f.selHmz : labelSets.hmz));
        setSelSal(prev => prev || new Set(f ? f.selSal : labelSets.sal));
        setSelSpecies(prev => prev || new Set(f ? f.selSpecies : labelSets.species));
        setSelTcat(prev => prev || new Set(f ? f.selTcat : labelSets.tcat));
        setSelFcat(prev => prev || new Set(f ? f.selFcat : labelSets.fcat));
        setSelScat(prev => prev || new Set(f ? f.selScat : labelSets.scat));
        setSelWT(prev => prev || new Set(f ? f.selWT : WT_LABELS));
        if (f && f.selBufZone) setSelBufZone(new Set(f.selBufZone));
        // NOTE the deliberate asymmetry with the sel* setters above. Those use
        // a `prev || ...` guard because they initialise to null. The ranges
        // initialise to real arrays like [0, 100], which are always truthy, so
        // the same guard would short-circuit on the initial value and the
        // ranges would never rehydrate at all. Assign them unconditionally.
        // Safe because this effect runs once per mount ([labelSets] only).
        const hydrate = (setter, key, dflt) => setter(f ? [...f[key]] : dflt);
        hydrate(setRRPF, 'rRPF', [0, 100]);
        hydrate(setRRPA, 'rRPA', [0, 100]);
        hydrate(setRComp, 'rComp', [-1, 1]);
        hydrate(setRCH, 'rCH', [0, 300]);
        hydrate(setRSol, 'rSol', [0, 12]);
        hydrate(setRSlp, 'rSlp', [0, 5]);
        hydrate(setRWet, 'rWet', [0, 5]);
        hydrate(setRPF, 'rPF', [0, 100]);
        hydrate(setRPS, 'rPS', [0, 100]);
        hydrate(setRPH, 'rPH', [0, 100]);
        hydrate(setRRest, 'rRest', [0, 100]);
        hydrate(setRCI, 'rCI', [0, 100]);
        // Auto-apply initial (all-selected) filters — only when nothing has
        // been applied yet (genuinely fresh load).
        setAppliedFilters(prev => prev || defaultFilters(labelSets));
      }, [labelSets]);

      // Applied-filter state (deferred — only updates on Apply click) is owned
      // by App and arrives as the appliedFilters/setAppliedFilters props, so it
      // survives this panel unmounting on a tab switch. Range filter state is
      // declared above, before the effect that rehydrates it.

      // --- Table sort + page state ---
      const [sortCol, setSortCol] = React.useState('ci');
      const [sortAsc, setSortAsc] = React.useState(false);
      const [page, setPage] = React.useState(0);
      const PAGE_SIZE = 30;

      // Sequential single-hue ramp for the Restoration Priority map mode.
      const rpRamp = (rp) => lerpHex(THEME.accentTint, THEME.ink, Math.max(0, Math.min(1, (rp || 0) / 100)));
      const [mapMode, setMapMode] = React.useState('tier');   // 'tier' | 'rp'

      // --- SQL-backed filtering (runs on Apply) ---
      const sqlRunQuery = React.useCallback((f, sort, asc) => {
        if (!db || !f) return { rows: [], count: 0, mapPts: [] };
        try {
        const where = buildBidQueryWhere(f);
        const sqlSort = sort === 'ci' ? 'ROUND(rpsf * rpsa / 100.0, 1)' : sort;
        const dir = asc ? 'ASC' : 'DESC';

        // Count
        const cr = db.exec(`SELECT COUNT(*) FROM bids WHERE ${where}`);
        const count = cr.length ? cr[0].values[0][0] : 0;

        // Full result set for map (cx, cy, rpsf, bid, tier)
        const mr = db.exec(
          `SELECT cx, cy, rpsf, bid, tier FROM bids WHERE cx IS NOT NULL AND cy IS NOT NULL AND ${where}`
        );
        const mapPts = mr.length ? mr[0].values.map(([x, y, rp, bid, tier]) => ({ x, y, rp, bid, tier })) : [];

        // All matching rows for table + export (sorted)
        const compDescSql = `CASE
          WHEN mc IS NULL OR mc = 0 THEN '\u2014'
          WHEN mc <= -0.5 THEN 'Strong Decid.'
          WHEN mc <= -0.1 THEN 'Deciduous Dom.'
          WHEN mc < 0.1 THEN 'Mixed'
          WHEN mc < 0.5 THEN 'Conifer Dom.'
          ELSE 'Strong Conifer' END`;
        const dr = db.exec(
          `SELECT bid, str, ROUND(rpsf * rpsa / 100.0, 1) AS ci,
                  tier, srz, ${compDescSql} AS compDesc, mc, mh, pf, ps, ph, sols, slps, wet, mgr,
                  cx, cy, rpsf, rpsa,
                  chk, fish, bfw, hmz, zon, jur,
                  ti, tic, fi, fic, si, sic, ai,
                  sal, sps, asp, af
           FROM bids WHERE ${where}
           ORDER BY ${sqlSort} ${dir}`
        );
        let rows = [];
        if (dr.length) {
          const cols = dr[0].columns;
          rows = dr[0].values.map(vals => {
            const o = {};
            cols.forEach((c, i) => { o[c] = vals[i]; });
            return o;
          });
        }
        return { rows, count, mapPts };
        } catch (err) { console.error('BID Query SQL error:', err, err.message); return { rows: [], count: 0, mapPts: [] }; }
      }, [db]);

      // --- Query results (only recomputed on appliedFilters or sort change) ---
      const queryResult = React.useMemo(() => {
        return sqlRunQuery(appliedFilters, sortCol, sortAsc);
      }, [appliedFilters, sortCol, sortAsc, sqlRunQuery]);

      const filtered = queryResult.rows;
      const filteredCount = queryResult.count;
      const pageData = filtered.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);
      const totalPages = Math.ceil(filtered.length / PAGE_SIZE);

      // Reset page when query changes
      React.useEffect(() => { setPage(0); }, [appliedFilters]);

      // --- Dirty detection ---
      const filtersDirty = React.useMemo(() => {
        if (!appliedFilters) return false;
        const f = appliedFilters;
        const setEq = (a, b) => a && b && a.size === b.size && [...a].every(x => b.has(x));
        const arrEq = (a, b) => a[0] === b[0] && a[1] === b[1];
        return !(
          setEq(selTier, f.selTier) && setEq(selChk, f.selChk) &&
          setEq(selFish, f.selFish) &&
          setEq(selSrz, f.selSrz) && setEq(selMgr, f.selMgr) &&
          setEq(selZon, f.selZon) && setEq(selBfw, f.selBfw) &&
          setEq(selHmz, f.selHmz) && setEq(selSal, f.selSal) &&
          setEq(selSpecies, f.selSpecies) &&
          setEq(selTcat, f.selTcat) && setEq(selFcat, f.selFcat) && setEq(selScat, f.selScat) &&
          setEq(selWT, f.selWT) &&
          setEq(selBufZone, f.selBufZone) &&
          arrEq(rRPF, f.rRPF) && arrEq(rRPA, f.rRPA) && arrEq(rComp, f.rComp) &&
          arrEq(rCH, f.rCH) && arrEq(rSol, f.rSol) && arrEq(rSlp, f.rSlp) &&
          arrEq(rWet, f.rWet) && arrEq(rPF, f.rPF) && arrEq(rPS, f.rPS) &&
          arrEq(rPH, f.rPH) && arrEq(rRest, f.rRest) && arrEq(rCI, f.rCI)
        );
      }, [appliedFilters, selTier, selChk, selFish, selSrz, selMgr, selZon, selBfw, selHmz,
          selSal, selSpecies, selTcat, selFcat, selScat, selWT, selBufZone,
          rRPF, rRPA, rComp, rCH, rSol, rSlp, rWet, rPF, rPS, rPH, rRest, rCI]);

      // --- Per-section active filter badge counts (renders as a number on the section header) ---
      const bidBadges = React.useMemo(() => {
        const cat = (sel, labels) => (sel && sel.size !== (labels?.length || 0)) ? 1 : 0;
        const catLen = (sel, len) => (sel && sel.size !== len) ? 1 : 0;
        const rng = (val, lo, hi) => (val[0] !== lo || val[1] !== hi) ? 1 : 0;
        return {
          metrics: cat(selTier, labelSets.tier) +
                   rng(rRPF, 0, 100) + rng(rRPA, 0, 100) + rng(rComp, -1, 1) +
                   rng(rCH, 0, 300) +
                   rng(rPF, 0, 100) + rng(rPS, 0, 100) + rng(rPH, 0, 100) + rng(rRest, 0, 100) +
                   rng(rCI, 0, 100),
          fishSalmon: cat(selChk, labelSets.chk) + cat(selFish, labelSets.fish) +
                      cat(selSal, labelSets.sal) + cat(selSpecies, labelSets.species),
          impairment: cat(selTcat, labelSets.tcat) + cat(selFcat, labelSets.fcat) + cat(selScat, labelSets.scat),
          river: (selBufZone.size !== 5 ? 1 : 0) + cat(selHmz, labelSets.hmz) +
                 cat(selBfw, labelSets.bfw) + cat(selSrz, labelSets.srz) +
                 catLen(selWT, 3),
          admin: cat(selMgr, labelSets.mgr) + cat(selZon, labelSets.zon),
          modifiers: rng(rSol, 0, 12) + rng(rSlp, 0, 5) + rng(rWet, 0, 5),
        };
      }, [labelSets, selTier, selChk, selFish, selSal, selSpecies, selTcat, selFcat, selScat,
          selHmz, selBfw, selSrz, selMgr, selZon, selBufZone, selWT,
          rRPF, rRPA, rComp, rCH, rSol, rSlp, rWet, rPF, rPS, rPH, rRest, rCI]);

      // --- Apply filters handler ---
      const applyFilters = () => {
        setAppliedFilters({
          selTier: new Set(selTier), selChk: new Set(selChk),
          selFish: new Set(selFish),
          selSrz: new Set(selSrz), selMgr: new Set(selMgr),
          selZon: new Set(selZon), selBfw: new Set(selBfw),
          selHmz: new Set(selHmz), selSal: new Set(selSal),
          selSpecies: new Set(selSpecies),
          selTcat: new Set(selTcat), selFcat: new Set(selFcat), selScat: new Set(selScat),
          selWT: new Set(selWT),
          // Zone-level only: gates the Summary Stats buffer-zone charts, not the BID set.
          selBufZone: new Set(selBufZone),
          rRPF: [...rRPF], rRPA: [...rRPA], rComp: [...rComp], rCH: [...rCH],
          rSol: [...rSol], rSlp: [...rSlp], rWet: [...rWet],
          rPF: [...rPF], rPS: [...rPS], rPH: [...rPH], rRest: [...rRest], rCI: [...rCI],
          _labels: labelSets,
        });
      };

      // --- XY extent (stable, computed once from DB) ---
      const extent = React.useMemo(() => {
        if (!dbReady(db)) return { xMin: -122.8, xMax: -121.8, yMin: 48.6, yMax: 49.0 };
        const r = db.exec("SELECT MIN(cx), MAX(cx), MIN(cy), MAX(cy) FROM bids WHERE cx IS NOT NULL");
        if (!r.length) return { xMin: -122.8, xMax: -121.8, yMin: 48.6, yMax: 49.0 };
        const [xMin, xMax, yMin, yMax] = r[0].values[0];
        const pad = 0.005;
        return { xMin: xMin - pad, xMax: xMax + pad, yMin: yMin - pad, yMax: yMax + pad };
      }, [db]);

      // --- Reset all ---
      const resetAll = () => {
        if (labelSets.tier) {
          setSelTier(new Set(labelSets.tier)); setSelChk(new Set(labelSets.chk));
          setSelFish(new Set(labelSets.fish));
          setSelSrz(new Set(labelSets.srz)); setSelMgr(new Set(labelSets.mgr));
          setSelZon(new Set(labelSets.zon)); setSelBfw(new Set(labelSets.bfw));
          setSelHmz(new Set(labelSets.hmz)); setSelSal(new Set(labelSets.sal));
          setSelSpecies(new Set(labelSets.species));
          setSelTcat(new Set(labelSets.tcat)); setSelFcat(new Set(labelSets.fcat));
          setSelScat(new Set(labelSets.scat));
          setSelWT(new Set(WT_LABELS));
          // Buffer zones are draft state too. Omitting this left the rail contradicting itself
          // after Reset: chips still narrowed and Apply still dirty, while Applied read "All reaches".
          setSelBufZone(new Set([0, 1, 2, 3, 4]));
        }
        setRRPF([0, 100]); setRRPA([0, 100]); setRComp([-1, 1]); setRCH([0, 300]);
        setRSol([0, 12]); setRSlp([0, 5]); setRWet([0, 5]);
        setRPF([0, 100]); setRPS([0, 100]); setRPH([0, 100]); setRRest([0, 100]);
        setRCI([0, 100]);
        setAppliedFilters(defaultFilters(labelSets));
      };

      // Clear one filter from the Applied row: reset its draft field and apply immediately.
      const clearFilter = (key) => {
        const d = defaultFilters(labelSets);
        const setters = { selTier: setSelTier, selChk: setSelChk, selFish: setSelFish, selSrz: setSelSrz, selMgr: setSelMgr,
          selZon: setSelZon, selBfw: setSelBfw, selHmz: setSelHmz, selSal: setSelSal, selSpecies: setSelSpecies,
          selTcat: setSelTcat, selFcat: setSelFcat, selScat: setSelScat, selWT: setSelWT, selBufZone: setSelBufZone,
          rRPF: setRRPF, rRPA: setRRPA, rComp: setRComp, rCH: setRCH, rSol: setRSol, rSlp: setRSlp, rWet: setRWet,
          rPF: setRPF, rPS: setRPS, rPH: setRPH, rRest: setRRest, rCI: setRCI };
        if (setters[key]) setters[key](d[key]);
        setAppliedFilters(prev => ({ ...prev, [key]: d[key] }));
      };

      // --- Table columns ---
      const COLUMNS = [
        { key: 'bid', label: 'BID', w: 80, num: true, fmt: v => v },
        { key: 'str', label: 'Stream', w: 100, fmt: v => v || '\u2014' },
        { key: 'rpsf', label: 'Restoration Priority', term: 'rp', w: 90, num: true, fmt: v => v?.toFixed(1) },
        { key: 'rpsa', label: 'Area percentile', term: 'percentile', w: 90, num: true, fmt: v => v?.toFixed(1) },
        { key: 'ci', label: 'Composite Index', term: 'ci', w: 90, num: true, fmt: v => v?.toFixed(1) },
        { key: 'tier', label: 'Tier', term: 'tier', w: 50, fmt: v => <TierPill tier={v} /> },
        { key: 'srz', label: 'Salmon Recovery Zone', w: 150, fmt: v => displaySrz(v) },
        { key: 'compDesc', label: 'Composition', term: 'comp', w: 100, fmt: v => v },
        { key: 'mh', label: 'Canopy height (ft)', w: 90, num: true, fmt: v => v > 0 ? v?.toFixed(0) : '\u2014' },
        { key: 'pf', label: '% Forest', w: 60, num: true, fmt: v => v?.toFixed(0) },
        { key: 'sols', label: 'Solar push', term: 'push', w: 70, num: true, fmt: v => v?.toFixed(1) },
        { key: 'tic', label: 'Temperature category', term: 'icat', w: 110, fmt: v => v ? `Category ${v}` : '\u2014' },
        { key: 'sps', label: 'Salmon species', w: 160, fmt: v => v ? v.replace(/Pink \(Odd Year\)/g, 'Pink (odd year)') : '\u2014' },
        { key: 'mgr', label: 'Owner', w: 90, fmt: v => v },
      ];

      const handleSort = (col) => {
        if (sortCol === col) setSortAsc(!sortAsc);
        else { setSortCol(col); setSortAsc(col === 'bid' || col === 'str' || col === 'srz' || col === 'mgr'); }
      };

      // Points bucketed for Recharts: by tier (canonical colours) or by RP decile (sequential ramp).
      const mapBuckets = React.useMemo(() => {
        if (mapMode === 'tier') {
          const by = Object.fromEntries(Object.keys(TIER_COLORS).map(t => [t, { fill: TIER_COLORS[t], points: [], name: t }]));
          queryResult.mapPts.forEach(pt => { (by[pt.tier] || by.P5).points.push(pt); });
          return Object.values(by).filter(b => b.points.length > 0);
        }
        const N = 10;
        const buckets = Array.from({ length: N }, (_, i) => ({ fill: rpRamp((i + 0.5) * (100 / N)), points: [], name: `${i * 10}–${i * 10 + 10}` }));
        queryResult.mapPts.forEach(pt => { buckets[Math.min(N - 1, Math.floor((pt.rp || 0) / (100 / N)))].points.push(pt); });
        return buckets.filter(bk => bk.points.length > 0);
      }, [queryResult, mapMode]);
      const mapPointCount = queryResult.mapPts.length;

      // --- Memoized map JSX (prevents Recharts re-render on slider drag) ---
      const memoizedMap = React.useMemo(() => (
        <div className="card">
          <div className="card-h">
            <h3>Bank locations</h3>
            <div style={{ display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
              <span className="num" style={{ fontSize: 12, color: THEME.muted }}>{mapPointCount.toLocaleString()} banks</span>
              {mapMode === 'tier'
                ? <LegendRow items={Object.keys(TIER_COLORS).map(t => ({ label: t, color: TIER_COLORS[t] }))} />
                : <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 11, color: THEME.muted }}>0<span style={{ width: 80, height: 8, borderRadius: 3, background: `linear-gradient(to right, ${THEME.accentTint}, ${THEME.ink})` }} />100</span>}
              <span className="seg">
                <button className={mapMode === 'tier' ? 'on' : ''} onClick={() => setMapMode('tier')}>Color by tier</button>
                <button className={mapMode === 'rp' ? 'on' : ''} onClick={() => setMapMode('rp')}>Restoration Priority</button>
              </span>
            </div>
          </div>
          <div style={{ background: `linear-gradient(180deg, #F6F7F4, #EEF1EE)`, borderRadius: '0 0 6px 6px' }}>
            <ResponsiveContainer width="100%" height={360}>
              <ScatterChart margin={{ top: 5, right: 10, bottom: 5, left: 10 }}>
                <XAxis type="number" dataKey="x" domain={[extent.xMin, extent.xMax]} tick={false} axisLine={false} tickLine={false} />
                <YAxis type="number" dataKey="y" domain={[extent.yMin, extent.yMax]} tick={false} axisLine={false} tickLine={false} />
                <ZAxis range={[5, 5]} />
                <Tooltip content={({ active, payload }) => {
                  if (!active || !payload?.length) return null;
                  const d = payload[0]?.payload;
                  return (
                    <div className="tip" style={{ position: 'static' }}>
                      <b className="num">{d?.bid}</b><br />Restoration Priority <span className="num">{d?.rp}</span> · {d?.tier}
                    </div>
                  );
                }} />
                {mapBuckets.map((bk, i) => (
                  <Scatter key={bk.name} name={bk.name} data={bk.points} fill={bk.fill} fillOpacity={0.8} isAnimationActive={false} />
                ))}
              </ScatterChart>
            </ResponsiveContainer>
          </div>
        </div>
      ), [mapBuckets, mapPointCount, extent, mapMode]);

      // --- Loading / error ---
      if (bidLoading) return (
        <div className="flex items-center justify-center py-12">
          <div className="text-gray-500">Loading BID Query data...</div>
        </div>
      );
      if (!selTier) return null; // not initialized yet

      // --- CSV Export ---
      const exportCSV = () => {
        const cols = [
          { key: 'bid', hdr: 'BID' },
          { key: 'str', hdr: 'Stream' },
          { key: 'rpsf', hdr: 'RP_Final' },
          { key: 'rpsa', hdr: 'Area_RP_Pctile' },
          { key: 'ci', hdr: 'Composite_Index' },
          { key: 'tier', hdr: 'Tier' },
          { key: 'srz', hdr: 'SR_Zone' },
          { key: 'chk', hdr: 'Spring_Chinook' },
          { key: 'sal', hdr: 'Salmon_Present' },
          { key: 'sps', hdr: 'Salmon_Species' },
          { key: 'ti', hdr: 'Temp_Impaired' },
          { key: 'tic', hdr: 'Temp_Impaired_Cat' },
          { key: 'fi', hdr: 'Fecal_Impaired' },
          { key: 'fic', hdr: 'Fecal_Impaired_Cat' },
          { key: 'si', hdr: 'Sediment_Impaired' },
          { key: 'sic', hdr: 'Sediment_Impaired_Cat' },
          { key: 'ai', hdr: 'Any_Impaired' },
          { key: 'fish', hdr: 'Fish_Access' },
          { key: 'bfw', hdr: 'BFW_Class' },
          { key: 'hmz', hdr: 'HMZ' },
          { key: 'mgr', hdr: 'Ownership' },
          { key: 'zon', hdr: 'Zoning' },
          { key: 'jur', hdr: 'County' },
          { key: 'compDesc', hdr: 'Composition_Desc' },
          { key: 'mc', hdr: 'Mean_Composition' },
          { key: 'mh', hdr: 'Mean_Canopy_Ht_ft' },
          { key: 'pf', hdr: 'Pct_Forest' },
          { key: 'ps', hdr: 'Pct_Shrub' },
          { key: 'ph', hdr: 'Pct_Herb' },
          { key: 'sols', hdr: 'Solar_Push' },
          { key: 'asp', hdr: 'Aspect_Deg' },
          { key: 'af', hdr: 'Aspect_North_Factor' },
          { key: 'slps', hdr: 'Slope_Push' },
          { key: 'wet', hdr: 'Wetland_Push' },
          { key: 'cx', hdr: 'Centroid_X' },
          { key: 'cy', hdr: 'Centroid_Y' },
        ];
        const esc = v => { const s = String(v ?? ''); return s.includes(',') || s.includes('"') ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const header = cols.map(c => c.hdr).join(',');
        const rows = filtered.map(b => cols.map(c => esc(b[c.key])).join(','));
        const csv = [header, ...rows].join('\n');
        // Prepend UTF-8 BOM (U+FEFF) so Excel reads it as UTF-8 (otherwise em-dashes etc. show as mojibake)
        const blob = new Blob([String.fromCharCode(0xFEFF) + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'bid_query_export.csv'; a.click();
        URL.revokeObjectURL(url);
      };

      const applied = summarizeFilters(appliedFilters, labelSets);
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Find banks</h2>
            <p style={{ margin: 0, color: THEME.muted, fontSize: 13 }}>Each row is one bank (BID). Filters combine with AND. Adjust, then Apply to update the map, the table, and Summary Stats.</p>
          </div>
          <div className="bq">
            <aside className="card rail">
              <div className="applied">
                <span className="lab">Applied</span>
                {applied.length === 0 ? <Chip sel>All reaches</Chip>
                  : applied.map(a => <Chip key={a.key} sel onClear={() => clearFilter(a.key)}>{a.label}</Chip>)}
              </div>
              <div className="scroll">
                <CollapsibleSection title="Restoration Metrics" defaultOpen={true} badge={bidBadges.metrics} hue={THEME.sections.rest.hue}>
                  <FilterGroup title="Priority tier" term="tier" labels={labelSets.tier || []} attr="tier" selected={selTier} setSelected={setSelTier} />
                  <div className="sgrid">
                    <DualRangeSlider label="Restoration Priority" term="rp" min={0} max={100} step={1} value={rRPF} onChange={setRRPF} fmt={v => v.toFixed(0)} />
                    <DualRangeSlider label="Area percentile" term="percentile" min={0} max={100} step={1} value={rRPA} onChange={setRRPA} fmt={v => v.toFixed(0)} />
                    <DualRangeSlider label="Composition" term="comp" min={-1} max={1} step={0.05} value={rComp} onChange={setRComp} fmt={v => v.toFixed(2)} />
                    <DualRangeSlider label="Canopy height (ft)" min={0} max={300} step={5} value={rCH} onChange={setRCH} fmt={v => v.toFixed(0)} />
                    <DualRangeSlider label="Composite Index" term="ci" min={0} max={100} step={1} value={rCI} onChange={setRCI} fmt={v => v.toFixed(0)} />
                    <DualRangeSlider label="% Restorable" min={0} max={100} step={1} value={rRest} onChange={setRRest} fmt={v => v.toFixed(0)} />
                    {moreRanges && <>
                      <DualRangeSlider label="% Forest" min={0} max={100} step={1} value={rPF} onChange={setRPF} fmt={v => v.toFixed(0)} />
                      <DualRangeSlider label="% Shrub" min={0} max={100} step={1} value={rPS} onChange={setRPS} fmt={v => v.toFixed(0)} />
                      <DualRangeSlider label="% Herb/Ground" min={0} max={100} step={1} value={rPH} onChange={setRPH} fmt={v => v.toFixed(0)} />
                    </>}
                  </div>
                  <div className="fl" style={{ marginTop: 6 }}><button type="button" onClick={() => setMoreRanges(!moreRanges)}>{moreRanges ? 'Hide landcover ranges' : 'Show 3 more ranges ›'}</button></div>
                </CollapsibleSection>

                <CollapsibleSection title="Fish / Salmon" defaultOpen={false} badge={bidBadges.fishSalmon} hue={THEME.sections.fish.hue}>
                  <FilterGroup title="Early Chinook" labels={labelSets.chk || []} attr="chk" selected={selChk} setSelected={setSelChk} display={v => ({ Y: 'Yes', N: 'No' })[v] || v} />
                  <FilterGroup title="Fish access" labels={labelSets.fish || []} attr="fish" selected={selFish} setSelected={setSelFish} display={v => ({ fish: 'Fish-bearing', gradient: 'Gradient-accessible' })[v] || v} />
                  <FilterGroup title="Salmon present" labels={labelSets.sal || []} attr="sal" selected={selSal} setSelected={setSelSal} display={v => ({ Y: 'Yes', N: 'No' })[v] || v} />
                  <FilterGroup title="Salmon species" labels={labelSets.species || []} attr="species" selected={selSpecies} setSelected={setSelSpecies} display={v => v === 'Pink (Odd Year)' ? 'Pink (odd year)' : v} />
                </CollapsibleSection>

                <CollapsibleSection title="Impairment" defaultOpen={false} badge={bidBadges.impairment} hue={THEME.sections.imp.hue}>
                  <FilterGroup title="Temperature category" term="icat" labels={labelSets.tcat || []} attr="tcat" selected={selTcat} setSelected={setSelTcat} display={v => `Category ${v}`} />
                  <FilterGroup title="Fecal coliform category" term="icat" labels={labelSets.fcat || []} attr="fcat" selected={selFcat} setSelected={setSelFcat} display={v => `Category ${v}`} />
                  <FilterGroup title="Sediment category" term="icat" labels={labelSets.scat || []} attr="scat" selected={selScat} setSelected={setSelScat} display={v => `Category ${v}`} />
                </CollapsibleSection>

                <CollapsibleSection title="River Context" defaultOpen={false} badge={bidBadges.river} hue={THEME.sections.riv.hue}>
                  <div className="fl"><span><Term id="zones">Buffer zones</Term> <span style={{ fontWeight: 400, color: THEME.muted }}>(zone charts only)</span></span></div>
                  <div className="chips">
                    {bufZoneLabels.map((lbl, i) => {
                      const on = selBufZone.has(i), disabled = i === 0;
                      return <Chip key={i} on={on} off={!on} color={THEME.sections.riv.hue} onClick={disabled ? undefined : () => toggleBufZone(i)} title={disabled ? 'The 0–50 ft zone is always included' : undefined}>{lbl}</Chip>;
                    })}
                  </div>
                  <FilterGroup title="Historic Migration Zone" term="zones" labels={labelSets.hmz || []} attr="hmz" selected={selHmz} setSelected={setSelHmz} display={v => ({ Y: 'Yes', N: 'No' })[v] || v} />
                  <FilterGroup title="Bankfull width class" term="bfw" labels={labelSets.bfw || []} attr="bfw" selected={selBfw} setSelected={setSelBfw} />
                  <FilterGroup title="Waterbody type" labels={WT_LABELS} attr="wt" selected={selWT || new Set(WT_LABELS)} setSelected={setSelWT} />
                  <FilterGroup title="Salmon Recovery Zone" labels={labelSets.srz || []} attr="srz" selected={selSrz} setSelected={setSelSrz} display={displaySrz} />
                </CollapsibleSection>

                <CollapsibleSection title="Administrative" defaultOpen={false} badge={bidBadges.admin} hue={THEME.sections.adm.hue}>
                  <FilterGroup title="Owner" labels={labelSets.mgr || []} attr="mgr" selected={selMgr} setSelected={setSelMgr} />
                  <FilterGroup title="Zoning" labels={labelSets.zon || []} attr="zon" selected={selZon} setSelected={setSelZon} />
                </CollapsibleSection>

                <CollapsibleSection title="Site Modifiers" defaultOpen={false} badge={bidBadges.modifiers} hue={THEME.sections.mod.hue}>
                  <div className="sgrid">
                    <DualRangeSlider label="Solar push" term="push" min={0} max={12} step={0.5} value={rSol} onChange={setRSol} fmt={v => v.toFixed(1)} />
                    <DualRangeSlider label="Slope push" term="push" min={0} max={5} step={0.25} value={rSlp} onChange={setRSlp} fmt={v => v.toFixed(1)} />
                    <DualRangeSlider label="Wetland push" term="push" min={0} max={5} step={0.25} value={rWet} onChange={setRWet} fmt={v => v.toFixed(1)} />
                  </div>
                </CollapsibleSection>
              </div>
              <div className="act">
                <Btn variant={filtersDirty ? 'attn' : 'primary'} onClick={applyFilters}>{filtersDirty ? 'Apply filters' : 'Filters applied'}</Btn>
                <Btn variant="ghost" onClick={resetAll}>Reset</Btn>
                <span className="cnt"><b className="num">{filteredCount.toLocaleString()}</b> of <span className="num">{totalBidCount.toLocaleString()}</span></span>
              </div>
            </aside>
            <div>
              {memoizedMap}

              <div className="card" style={{ marginTop: 18 }}>
                <div className="card-h">
                  <h3>Results <Badge>{filteredCount.toLocaleString()}</Badge></h3>
                  <Btn icon="download" onClick={exportCSV}>Export CSV</Btn>
                </div>
                <div style={{ overflowX: 'auto' }}>
                  <table className="tbl">
                    <thead><tr>
                      {COLUMNS.map(col => (
                        <th key={col.key} onClick={() => handleSort(col.key)} className={`${col.num ? 'n' : ''} ${sortCol === col.key ? 'sorted' : ''}`}
                          style={{ minWidth: col.w, cursor: 'pointer', userSelect: 'none' }}>
                          {col.term ? <Term id={col.term}>{col.label}</Term> : col.label}
                          {sortCol === col.key && <span style={{ marginLeft: 3 }}>{sortAsc ? '\u25B2' : '\u25BC'}</span>}
                        </th>
                      ))}
                    </tr></thead>
                    <tbody>
                      {pageData.map(b => (
                        <tr key={b.bid}>
                          {COLUMNS.map(col => (
                            <td key={col.key} className={col.num ? 'n' : ''}>
                              {col.key === 'bid'
                                ? <a href="#" onClick={e => { e.preventDefault(); window.open(window.location.pathname + '#bid/' + b.bid, '_blank'); }}
                                     title="Open in Bank Explorer (new tab)" style={{ fontWeight: 500, textDecoration: 'none', borderBottom: `1px dotted ${THEME.accent}`, color: THEME.accentInk }}>{b.bid}</a>
                                : col.fmt(b[col.key])}
                            </td>
                          ))}
                        </tr>
                      ))}
                      {pageData.length === 0 && <tr><td colSpan={COLUMNS.length} style={{ textAlign: 'center', padding: 16, color: THEME.muted }}>No banks match the current filters</td></tr>}
                    </tbody>
                  </table>
                </div>
                {totalPages > 1 && (
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 12px', fontSize: 12, color: THEME.muted, borderTop: `1px solid ${THEME.line2}` }}>
                    <Btn variant="ghost" sm onClick={() => setPage(Math.max(0, page - 1))} disabled={page === 0}>‹ Prev</Btn>
                    <span>Page <span className="num">{page + 1}</span> of <span className="num">{totalPages}</span> · 30 per page</span>
                    <Btn variant="ghost" sm onClick={() => setPage(Math.min(totalPages - 1, page + 1))} disabled={page >= totalPages - 1}>Next ›</Btn>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // App Shell
    // ============================================================
    const TABS = [
      { id: 'bid_query',     icon: 'search', label: 'BID Query' },
      { id: 'summary_stats', icon: 'bars',   label: 'Summary Stats' },
      { id: 'bank_explorer', icon: 'bank',   label: 'Bank Explorer' },
      { id: 'scoring_lab',   icon: 'lab',    label: 'Scoring Lab' },
    ];

    // Two-up grid used by every stats section.
    function ChartCell({ title, story, right, children }) {
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
            <h4 style={{ fontSize: 12.5, fontWeight: 600, color: THEME.ink2, margin: '0 0 2px' }}>{title}</h4>
            {right}
          </div>
          {story && <p style={{ margin: '0 0 6px', fontSize: 11.5, color: THEME.muted }}>{story}</p>}
          {children}
        </div>
      );
    }
    function ChartGrid({ children }) {
      return <div className="grid grid-cols-1 lg:grid-cols-2 gap-x-6 gap-y-5">{children}</div>;
    }

    // --- Stats section 1: Restoration Metrics ---
    // Shape helpers shared by the sections: byCat/byExpr rows -> kit rows.
    // `rawKeyFn`, when given, maps a row's (possibly display-renamed) `key` back to the
    // raw value the colour registry is keyed by - e.g. srzDisp/fishDisplay rename `key`
    // for the label before this runs, so the registry lookup needs the pre-rename value.
    const toDumbbell = (sel, wria, rawKeyFn) => {
      const w = new Map((wria || []).map(r => [r.key, r]));
      return sel.map(r => ({ key: r.key, rawKey: rawKeyFn ? rawKeyFn(r) : r.key, sel: r.rpf, ci: r.ci, n: r.n,
        wria: wria ? (w.get(r.key)?.rpf ?? null) : null, wci: wria ? (w.get(r.key)?.ci ?? null) : null }));
    };
    // Partition shares: each row as % of the rows' own total (categories are mutually exclusive).
    const toShare = (sel, wria, field = 'acres') => {
      const tot = a => a.reduce((s, r) => s + r[field], 0) || 1;
      const st = tot(sel), wt = wria ? tot(wria) : 1, w = new Map((wria || []).map(r => [r.key, r]));
      return sel.map(r => ({ key: r.key, sel: r[field] / st * 100, raw: r.acres,
        wria: wria ? ((w.get(r.key)?.[field] || 0) / wt * 100) : null }));
    };
    // compByZone rows -> heatmap rows for the surviving zones, plus a WRIA baseline row.
    // For the `comp` metric a cell distinguishes two absences: `null` means the zone
    // isn't in the result set at all ("no data"), while the string 'noforest' means the
    // zone IS present but has zero forest area (forestSqft falsy) - a forest-only metric
    // has nothing to average there, so it must not be shown as a numeric composition value.
    const toHeat = (sel, wriaAll, metric, zones) => {
      const shown = ZONE_LABELS.map((zl, z) => ({ zl, z })).filter(({ z }) => !zones || zones.size === 0 || zones.has(z));
      const keys = [...new Set(sel.map(r => r.key))];
      const cellOf = h => {
        if (!h) return null;
        // comp and cht are both forest-only metrics: a zone with no forest area has
        // nothing to average, so render the "no forest" band rather than a fabricated
        // 0 (which would also be indistinguishable from a real zero-height/mixed value).
        if ((metric === 'comp' || metric === 'cht') && !h.forestSqft) return 'noforest';
        return h[metric];
      };
      const rows = keys.map(k => ({ key: k, cells: shown.map(({ z }) => cellOf(sel.find(r => r.key === k && r.z === z))) }));
      if (wriaAll) rows.push({ key: 'WRIA', baseline: true, cells: shown.map(({ z }) => cellOf(wriaAll.find(r => r.z === z))) });
      return { rows, cols: shown.map(s => s.zl) };
    };
    const S_REST = THEME.sections.rest;

    // --- Stats section 1: Restoration Metrics ---
    function StatsSectionRestoration({ db, where, isAll, zones }) {
      const S = window.__stats;
      const [showLc, setShowLc] = React.useState(false);
      const d = React.useMemo(() => ({
        rpfHist: S.hist(db, where, 'rpsf', 0, 100, 20), rpfMean: S.mean(db, where, 'rpsf'),
        ciHist:  S.hist(db, where, S.CI_EXPR, 0, 100, 20), ciMean: S.mean(db, where, S.CI_EXPR),
        tier:    S.byCat(db, where, 'tier'),
        compTier: S.compByZone(db, where, 'b.tier', zones),
        lc:      S.lcByZone(db, where, zones),
      }), [db, where, zones]);
      const w = React.useMemo(() => isAll ? null : ({
        rpfHist: S.hist(db, '1', 'rpsf', 0, 100, 20), rpfMean: S.mean(db, '1', 'rpsf'),
        ciHist:  S.hist(db, '1', S.CI_EXPR, 0, 100, 20), ciMean: S.mean(db, '1', S.CI_EXPR),
        tier:    S.byCat(db, '1', 'tier'),
        compAll: S.compByZone(db, '1', "'WRIA'", zones),
      }), [db, isAll, zones]);
      const tierRows = [...d.tier].sort((a, b) => a.key.localeCompare(b.key));
      const heat = toHeat(d.compTier, w && w.compAll, 'comp', zones);
      const lcRows = d.lc.filter(r => !zones || zones.size === 0 || zones.has(r.z)).map(r => ({ zone: ZONE_LABELS[r.z], lc: r.lc }));
      return (
        <ChartGrid>
          <ChartCell title={<><Term id="rp">Restoration Priority</Term> distribution</>} story="Reaches per 5-point bin. Solid line: selection mean · dashed: WRIA mean.">
            <KHistogram sel={d.rpfHist} wria={w && w.rpfHist} color={S_REST.hue} meanSel={d.rpfMean} meanWria={w && w.rpfMean} />
          </ChartCell>
          <ChartCell title={<><Term id="ci">Composite Index</Term> distribution</>} story="Reaches per 5-point bin. Solid line: selection mean · dashed: WRIA mean.">
            <KHistogram sel={d.ciHist} wria={w && w.ciHist} color={lerpHex(S_REST.hue, '#ffffff', 0.35)} meanSel={d.ciMean} meanWria={w && w.ciMean} />
          </ChartCell>
          <ChartCell title={showLc ? 'Landcover by buffer zone' : <><Term id="comp">Composition</Term> by <Term id="zones">buffer zone</Term>, by tier</>}
            story={showLc ? 'Share of zone area in each of the nine landcover classes.' : 'Cell colour: conifer teal ← Forest green at 0 → deciduous brick, averaged by forest area. Zones with no forest show as a separate grey band, not as mixed. Bottom row is the WRIA baseline.'}
            right={<span className="seg"><button className={showLc ? '' : 'on'} onClick={() => setShowLc(false)}>Composition</button><button className={showLc ? 'on' : ''} onClick={() => setShowLc(true)}>9-class landcover</button></span>}>
            {showLc ? <KLcStack rows={lcRows} /> : <KHeatmap rows={heat.rows} cols={heat.cols} mode="div" />}
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by <Term id="tier">tier</Term></>} story="Filled dot: selection · hollow: WRIA · bar shows the gap. Composite Index in the hover.">
            <KDumbbell rows={toDumbbell(tierRows, w && w.tier)} color={S_REST.hue} attr="tier" />
          </ChartCell>
        </ChartGrid>
      );
    }

    const S_FISH = THEME.sections.fish, S_IMP = THEME.sections.imp, S_RIV = THEME.sections.riv,
          S_ADM = THEME.sections.adm, S_MOD = THEME.sections.mod;

    // --- 2: Fish / Salmon ---
    function StatsSectionFish({ db, where, isAll, zones }) {
      const S = window.__stats;
      const SAL_EXPR = "CASE WHEN b.sal=1 THEN 'Salmon-bearing' ELSE 'No salmon' END";
      const d = React.useMemo(() => ({
        species: S.speciesAcres(db, where), compSal: S.compByZone(db, where, SAL_EXPR, zones),
        fish: S.byCat(db, where, 'fish'), totalSqft: S.kpis(db, where).sqft || 1,
      }), [db, where, zones]);
      const w = React.useMemo(() => isAll ? null : ({
        species: S.speciesAcres(db, '1'), compAll: S.compByZone(db, '1', "'WRIA'", zones),
        fish: S.byCat(db, '1', 'fish'), totalSqft: S.kpis(db, '1').sqft || 1,
      }), [db, isAll, zones]);
      // Species overlap (a reach hosts several), so each is its own rate against total selected area.
      const pct = (rows, tot) => new Map(rows.map(s => [s.species, s.acres * S.SQFT_PER_ACRE / tot * 100]));
      const sp = pct(d.species, d.totalSqft), wsp = w && pct(w.species, w.totalSqft);
      // Display-only remap (DB value 'Pink (Odd Year)' must stay as-is - a LIKE match depends on it).
      const spRows = [...sp.entries()].sort((a, b) => b[1] - a[1]).map(([k, v]) => ({ key: k === 'Pink (Odd Year)' ? 'Pink (odd year)' : k, sel: v, wria: wsp ? wsp.get(k) : null, raw: d.species.find(s => s.species === k).acres }));
      const fishDisplay = r => ({ ...r, key: r.key === 'fish' ? 'Fish-bearing' : r.key === 'gradient' ? 'Gradient-accessible' : r.key });
      const comp = toHeat(d.compSal, w && w.compAll, 'comp', zones), ht = toHeat(d.compSal, w && w.compAll, 'cht', zones);
      return (
        <ChartGrid>
          <ChartCell title="Salmon species presence" story="Species overlap, so each bar is its own rate: % of selected acres where the species is present. Hollow dot: WRIA rate.">
            <KHBars rows={spRows} color={S_FISH.hue} />
          </ChartCell>
          <ChartCell title={<><Term id="comp">Composition</Term> by buffer zone, salmon-bearing vs not</>} story="Same ramp as Restoration Metrics, weighted by forest area; zones with no forest show as a separate band. Bottom row is the WRIA baseline.">
            <KHeatmap rows={comp.rows} cols={comp.cols} mode="div" />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by fish access class</>}>
            <KDumbbell rows={toDumbbell(d.fish.map(fishDisplay), w && w.fish.map(fishDisplay), r => r.key === 'Fish-bearing' ? 'fish' : r.key === 'Gradient-accessible' ? 'gradient' : r.key)} color={S_FISH.hue} attr="fish" />
          </ChartCell>
          <ChartCell title={<><Term id="canopy">Canopy height</Term> by buffer zone, salmon-bearing vs not</>} story="Mean height of trees only, averaged over forest area; zones with no forest show as a separate band. Sequential single hue: darker is taller. Values in feet.">
            <KHeatmap rows={ht.rows} cols={ht.cols} mode="seq" fmt={v => `${v.toFixed(0)} ft`} />
          </ChartCell>
        </ChartGrid>
      );
    }

    // --- 3: Impairment ---
    function StatsSectionImpairment({ db, where, isAll, zones }) {
      const S = window.__stats;
      const TEMP_EXPR = "CASE WHEN b.ti=1 THEN 'Temperature impaired' ELSE 'Not impaired' END";
      const TEMP_CAT_EXPR = "CASE WHEN ti=1 THEN 'Category ' || tic ELSE 'Not impaired' END";
      // Three independent flags (a reach can carry all three): each is its own rate, never normalised.
      const rates = (whr) => {
        const totalSqft = S.kpis(db, whr).sqft || 1;
        return [['Temperature', 'ti'], ['Fecal coliform', 'fi'], ['Sediment', 'si']].map(([k, col]) => {
          const v = S.kpis(db, `(${whr}) AND ${col}=1`);
          return { key: k, n: v.n, acres: v.acres, pct: v.sqft / totalSqft * 100 };
        });
      };
      const d = React.useMemo(() => ({
        rates: rates(where), cats: S.byExpr(db, where, TEMP_CAT_EXPR), compTemp: S.compByZone(db, where, TEMP_EXPR, zones),
      }), [db, where, zones]);
      const w = React.useMemo(() => isAll ? null : ({
        rates: rates('1'), cats: S.byExpr(db, '1', TEMP_CAT_EXPR), compAll: S.compByZone(db, '1', "'WRIA'", zones),
      }), [db, isAll, zones]);
      const tiles = d.rates.map((r, i) => ({ ...r, sel: r.pct, wria: w ? w.rates[i].pct : null }));
      const imp = rows => rows.filter(r => r.key !== 'Not impaired');   // share read against impaired acreage
      const comp = toHeat(d.compTemp, w && w.compAll, 'comp', zones);
      return (
        <div>
          <div style={{ marginBottom: 16 }}><KRateTiles tiles={tiles} hue={S_IMP.hue} /></div>
          <ChartGrid>
            <ChartCell title={<>Temperature-impaired acres by <Term id="icat">303(d) category</Term></>} story="Share of temperature-impaired acres. Outlined bar: WRIA.">
              <KVBars rows={toShare(imp(d.cats), w && imp(w.cats))} color={S_IMP.hue} />
            </ChartCell>
            <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by temperature category</>}>
              <KDumbbell rows={toDumbbell(d.cats, w && w.cats, r => r.key.startsWith('Category ') ? r.key.slice('Category '.length) : r.key)} color={S_IMP.hue} attr="tcat" />
            </ChartCell>
            <ChartCell title={<><Term id="comp">Composition</Term> by buffer zone, temperature-impaired vs not</>}>
              <KHeatmap rows={comp.rows} cols={comp.cols} mode="div" />
            </ChartCell>
          </ChartGrid>
        </div>
      );
    }

    // --- 4: River Context ---
    // Ascending channel width. Mainstem is the widest class, confirmed against the source
    // methods; an earlier draft had it before Large Stream.
    const BFW_ORDER = ['Headwater/Ditch', 'Small Stream', 'Medium Stream', 'Large Stream', 'Mainstem'];
    function StatsSectionRiver({ db, where, isAll, zones }) {
      const S = window.__stats;
      const d = React.useMemo(() => ({
        bfw: S.byCat(db, where, 'bfw'), compSrz: S.compByZone(db, where, 'b.srz', zones), srz: S.byCat(db, where, 'srz'),
      }), [db, where, zones]);
      const w = React.useMemo(() => isAll ? null : ({
        bfw: S.byCat(db, '1', 'bfw'), compAll: S.compByZone(db, '1', "'WRIA'", zones), srz: S.byCat(db, '1', 'srz'),
      }), [db, isAll, zones]);
      const byOrder = rows => [...rows].sort((a, b) => BFW_ORDER.indexOf(a.key) - BFW_ORDER.indexOf(b.key));
      const srzDisp = rows => rows.map(r => ({ ...r, key: displaySrz(r.key) }));
      const comp = toHeat(srzDisp(d.compSrz), w && w.compAll, 'comp', zones);
      const srzD = toDumbbell(srzDisp(d.srz), w && srzDisp(w.srz), r => SRZ_RAW[r.key] || r.key);
      if (w) srzD.sort((a, b) => (b.sel - (b.wria ?? 0)) - (a.sel - (a.wria ?? 0)));
      return (
        <ChartGrid>
          <ChartCell title={<>Share of selected acres by <Term id="bfw">stream size</Term></>} story="Bankfull width class. Outlined bar: WRIA.">
            <KVBars rows={toShare(byOrder(d.bfw), w && byOrder(w.bfw))} color={S_RIV.hue} />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by stream size</>}>
            <KDumbbell rows={toDumbbell(byOrder(d.bfw), w && byOrder(w.bfw))} color={S_RIV.hue} attr="bfw" />
          </ChartCell>
          <ChartCell title={<><Term id="comp">Composition</Term> by buffer zone, by Salmon Recovery Zone</>} story="Twelve zones read as a grid; lines could not.">
            <KHeatmap rows={comp.rows} cols={comp.cols} mode="div" />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by Salmon Recovery Zone</>} story={w ? 'Sorted by gap to WRIA, largest first.' : undefined}>
            <KDumbbell rows={srzD} color={S_RIV.hue} attr="srz" />
          </ChartCell>
        </ChartGrid>
      );
    }

    // Collapse a byCat result to the top N by area, folding the rest into "Other".
    // Fold a byCat result to the categories in `keys`, summing everything else into
    // "Other". `keys` is passed in rather than derived per-series on purpose: the
    // selection and the WRIA baseline rank categories differently, so folding each
    // to its OWN top-N produced two different partitions. Under a Tier P1 filter the
    // selection's head held Public/Open Space while the WRIA head held Federal Forest,
    // so Public/Open Space drew with no ghost behind it, Federal Forest vanished from
    // the chart despite having a WRIA value, and the two "Other" bars silently
    // compared different sets of categories. Both series must fold to one key set.
    function foldTo(rows, keys) {
      const keep = new Set(keys);
      const byKey = new Map(rows.map(r => [r.key, r]));
      const head = keys.map(k => byKey.get(k) || {
        key: k, n: 0, sqft: 0, acres: 0, rpf: 0, ci: 0,
      });
      const tail = rows.filter(r => !keep.has(r.key));
      if (!tail.length) return head;
      const sqft = tail.reduce((a, b) => a + b.sqft, 0);
      const cnt  = tail.reduce((a, b) => a + b.n, 0);
      const wsum = (f) => sqft ? tail.reduce((a, b) => a + b[f] * b.sqft, 0) / sqft : 0;
      return [...head, {
        key: 'Other', n: cnt, sqft, acres: sqft / SQFT_PER_ACRE,
        rpf: wsum('rpf'), ci: wsum('ci'),
      }];
    }

    // The canonical key set for a fold: the largest N categories WRIA-wide, so the
    // chart's categories stay stable as the user changes the filter.
    const topKeys = (wriaRows, n) => wriaRows.slice(0, n).map(r => r.key);

    // --- 5: Administrative --- (foldTo / topKeys unchanged from the previous build)
    function StatsSectionAdmin({ db, where, isAll, zones }) {
      const S = window.__stats;
      const keys = React.useMemo(() => {
        const wMgr = S.byCat(db, '1', 'mgr'), wZon = S.byCat(db, '1', 'zon');
        return { mgr: topKeys(wMgr, 6), mgr5: topKeys(wMgr, 5), zon: topKeys(wZon, 6), wMgr, wZon };
      }, [db]);
      const d = React.useMemo(() => ({
        mgr: foldTo(S.byCat(db, where, 'mgr'), keys.mgr), compMgr: S.compByZone(db, where, 'b.mgr', zones),
        zon: foldTo(S.byCat(db, where, 'zon'), keys.zon),
      }), [db, where, keys, zones]);
      const w = React.useMemo(() => isAll ? null : ({
        mgr: foldTo(keys.wMgr, keys.mgr), compAll: S.compByZone(db, '1', "'WRIA'", zones), zon: foldTo(keys.wZon, keys.zon),
      }), [db, isAll, keys, zones]);
      const keep = new Set(keys.mgr5);
      const comp = toHeat(d.compMgr.filter(r => keep.has(r.key)), w && w.compAll, 'comp', zones);
      return (
        <ChartGrid>
          <ChartCell title="Share of selected acres by owner" story="Top six owners WRIA-wide; the rest fold into Other. Hollow dot: WRIA.">
            <KHBars rows={toShare(d.mgr, w && w.mgr)} color={S_ADM.hue} />
          </ChartCell>
          <ChartCell title={<><Term id="comp">Composition</Term> by buffer zone, by owner (top 5)</>}>
            <KHeatmap rows={comp.rows} cols={comp.cols} mode="div" />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by owner</>}>
            <KDumbbell rows={toDumbbell(d.mgr, w && w.mgr)} color={S_ADM.hue} attr="mgr" />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by zoning group</>}>
            <KDumbbell rows={toDumbbell(d.zon, w && w.zon)} color={S_ADM.hue} attr="zon" />
          </ChartCell>
        </ChartGrid>
      );
    }

    // 8-point aspect class from degrees; NULL aspect (flat) becomes 'Flat/Unknown'.
    // This expression is passed to byExpr/byCat (which query `bids` unaliased), so it
    // deliberately does NOT use the `b.` prefix that compByZone expressions require.
    const ASPECT_CLASS_EXPR = `CASE
      WHEN asp IS NULL THEN 'Flat/Unknown'
      WHEN asp >= 337.5 OR asp < 22.5  THEN 'N'
      WHEN asp < 67.5  THEN 'NE'
      WHEN asp < 112.5 THEN 'E'
      WHEN asp < 157.5 THEN 'SE'
      WHEN asp < 202.5 THEN 'S'
      WHEN asp < 247.5 THEN 'SW'
      WHEN asp < 292.5 THEN 'W'
      ELSE 'NW' END`;

    // --- 6: Site Modifiers (solar, slope, wetland pushes) --- ASPECT_CLASS_EXPR unchanged
    function StatsSectionModifiers({ db, where, isAll }) {
      const S = window.__stats;
      const aspectRows = (whr) => new Map(S.byExpr(db, whr, ASPECT_CLASS_EXPR).map(r => [r.key, r]));
      const QUINT_EXPR = "'Q' || (CAST(MIN(4, sols / 2.4) AS INTEGER) + 1)";
      const WET_EXPR = "CASE WHEN wet > 0 THEN 'Wetland-connected' ELSE 'No connection' END";
      const q = (whr) => ({
        solHist: S.hist(db, whr, 'sols', 0, 12, 24), solMean: S.mean(db, whr, 'sols'),
        slpHist: S.hist(db, whr, 'slps', 0, 5, 20), slpMean: S.mean(db, whr, 'slps'),
        wetHist: S.hist(db, whr, 'wet', 0, 5, 20), wetMean: S.mean(db, whr, 'wet'),
        asp: aspectRows(whr), solQuint: S.byExpr(db, whr, QUINT_EXPR), wetCat: S.byExpr(db, whr, WET_EXPR),
        sqft: S.kpis(db, whr).sqft || 1,
      });
      const d = React.useMemo(() => q(where), [db, where]);
      const w = React.useMemo(() => isAll ? null : q('1'), [db, isAll]);
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      const share = (m, k, tot) => (m.get(k)?.sqft || 0) / tot * 100;
      const rose = dirs.map(k => ({ key: k, sel: share(d.asp, k, d.sqft), wria: w ? share(w.asp, k, w.sqft) : null }));
      const band = rows => [...rows].sort((a, b) => a.key.localeCompare(b.key)).map(r => ({ ...r, key: SOLAR_BAND_LABELS[+r.key.slice(1) - 1] || r.key }));
      return (
        <ChartGrid>
          <ChartCell title={<><Term id="push">Solar push</Term> distribution</>} story="Reaches per 0.5-point bin. Solid line: selection mean · dashed: WRIA mean.">
            <KHistogram sel={d.solHist} wria={w && w.solHist} color={S_MOD.hue} meanSel={d.solMean} meanWria={w && w.solMean} xMin={0} xMax={12} fmt={v => v.toFixed(v % 1 ? 1 : 0)} />
          </ChartCell>
          <ChartCell title="Share of selected acres by aspect" story="Compass rose. The empty north sector is a property of the source data, shown honestly.">
            <KRose rows={rose} color={S_MOD.hue} flat={share(d.asp, 'Flat/Unknown', d.sqft)} />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by solar push band</>} story="Five equal bands of solar push (0–2.4 … 9.6–12).">
            <KDumbbell rows={toDumbbell(band(d.solQuint), w && band(w.solQuint))} color={S_MOD.hue} />
          </ChartCell>
          <ChartCell title={<><Term id="push">Slope</Term> and wetland push distributions</>}>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
              <div><div style={{ fontSize: 11, color: THEME.muted, marginBottom: 2 }}>Slope push</div><KHistogram sel={d.slpHist} wria={w && w.slpHist} color={THEME.faint} meanSel={d.slpMean} meanWria={w && w.slpMean} xMin={0} xMax={5} fmt={v => v.toFixed(1)} height={150} /></div>
              <div><div style={{ fontSize: 11, color: THEME.muted, marginBottom: 2 }}>Wetland push</div><KHistogram sel={d.wetHist} wria={w && w.wetHist} color={lerpHex(S_RIV.hue, '#ffffff', 0.35)} meanSel={d.wetMean} meanWria={w && w.wetMean} xMin={0} xMax={5} fmt={v => v.toFixed(1)} height={150} /></div>
            </div>
          </ChartCell>
          <ChartCell title="Share of selected acres by wetland connection">
            <KVBars rows={toShare(d.wetCat, w && w.wetCat)} color={lerpHex(S_RIV.hue, '#ffffff', 0.2)} />
          </ChartCell>
          <ChartCell title={<>Mean <Term id="rp">Restoration Priority</Term> by wetland connection</>}>
            <KDumbbell rows={toDumbbell(d.wetCat, w && w.wetCat)} color={lerpHex(S_RIV.hue, '#ffffff', 0.2)} />
          </ChartCell>
        </ChartGrid>
      );
    }

    // WRIA-wide baseline: identical queries with WHERE 1, computed once per db.
    function useWriaBaseline(db) {
      const ref = React.useRef({ db: null, val: null });
      if (db && ref.current.db !== db) {
        const S = window.__stats;
        ref.current = { db, val: { kpis: S.kpis(db, '1') } };
      }
      return ref.current.val;
    }

    function SummaryStatsPanel({ data, sharedBidData, appliedFilters, onEditFilters }) {
      const db = sharedBidData?.db || null;
      const S = window.__stats;
      const wria = useWriaBaseline(db);

      // The applied filter's WHERE clause; "1" until the query panel initialises.
      // Buffer-zone gate for the zone-level charts. Identity must be stable or the
      // section memos below would recompute on every render.
      const zones = React.useMemo(
        () => (appliedFilters && appliedFilters.selBufZone)
          ? new Set(appliedFilters.selBufZone) : null,
        [appliedFilters]);

      const where = React.useMemo(
        () => (db && appliedFilters) ? buildBidQueryWhere(appliedFilters) : '1',
        [db, appliedFilters]);

      const sel = React.useMemo(() => {
        if (!dbReady(db)) return null;
        return {
          kpis: S.kpis(db, where),
          tier: S.byCat(db, where, 'tier'),
          sal: S.byExpr(db, where, "CASE WHEN sal=1 THEN 'Salmon-bearing' ELSE 'No salmon' END"),
          temp: S.byExpr(db, where, "CASE WHEN ti=1 THEN 'Temperature impaired' ELSE 'Not impaired' END"),
          srz: S.byCat(db, where, 'srz'),
          mgr: S.byCat(db, where, 'mgr'),
          zon: S.byCat(db, where, 'zon'),
        };
      }, [db, where]);

      const wriaZone0 = React.useMemo(() => {
        if (!dbReady(db)) return null;
        return {
          tier: S.byCat(db, '1', 'tier'),
          sal: S.byExpr(db, '1', "CASE WHEN sal=1 THEN 'Salmon-bearing' ELSE 'No salmon' END"),
          temp: S.byExpr(db, '1', "CASE WHEN ti=1 THEN 'Temperature impaired' ELSE 'Not impaired' END"),
          srz: S.byCat(db, '1', 'srz'),
          mgr: S.byCat(db, '1', 'mgr'),
          zon: S.byCat(db, '1', 'zon'),
        };
      }, [db]);

      // Full-selection state: ghosts would sit exactly under the solid series.
      const isAll = !!(sel && wria && sel.kpis.n === wria.kpis.n);
      const g = obj => isAll ? null : obj;   // ghost gate

      if (!db || !sel || !wria) return (
        <div className="card" style={{ padding: 24, textAlign: 'center', color: THEME.muted }}>
          Loading summary statistics...
        </div>
      );

      const k = sel.kpis, wk = wria.kpis;
      const applied = summarizeFilters(appliedFilters, appliedFilters && appliedFilters._labels);
      const Delta = ({ a, b, pctOf }) => {
        if (a == null || b == null) return null;   // no mean to compare (zero-match selection)
        if (pctOf) return <span className="delta eq">{(a / b * 100).toFixed(0)}% of all</span>;
        const d = a - b; if (isAll || Math.abs(d) < 0.05) return <span className="delta eq">= WRIA</span>;
        return <span className={`delta ${d < 0 ? 'dn' : ''}`}>{d > 0 ? '▲' : '▼'} {Math.abs(d).toFixed(1)}</span>;
      };
      const Kpi = ({ label, value, wriaValue, delta }) => (
        <div className="card kpi"><div className="k">{label}</div><div className="v">{value}</div>
          <div className="w"><span>WRIA <span className="num">{wriaValue}</span></span>{delta}</div></div>
      );
      const sections = [
        ['Restoration Metrics', 'bars', S_REST, '4 charts', true, <StatsSectionRestoration db={db} where={where} isAll={isAll} zones={zones} />],
        ['Fish / Salmon', 'fish', S_FISH, '4 charts', false, <StatsSectionFish db={db} where={where} isAll={isAll} zones={zones} />],
        ['Impairment', 'warn', S_IMP, '3 tiles · 3 charts', false, <StatsSectionImpairment db={db} where={where} isAll={isAll} zones={zones} />],
        ['River Context', 'river', S_RIV, '4 charts', false, <StatsSectionRiver db={db} where={where} isAll={isAll} zones={zones} />],
        ['Administrative', 'building', S_ADM, 'Owner · zoning · 4 charts', false, <StatsSectionAdmin db={db} where={where} isAll={isAll} zones={zones} />],
        ['Site Modifiers', 'sun', S_MOD, 'Solar · slope · wetland pushes', false, <StatsSectionModifiers db={db} where={where} isAll={isAll} />],
      ];
      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Selection vs. the watershed</h2>
            <p style={{ margin: 0, color: THEME.muted, fontSize: 13 }}>Every chart compares your applied query against the <Term id="wria">WRIA-wide baseline</Term>.</p>
          </div>
          <div className="card">
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', alignItems: 'center', padding: '10px 14px', borderBottom: `1px solid ${THEME.line2}` }}>
              <span style={{ fontSize: 11, color: THEME.muted, marginRight: 2 }}>Comparing</span>
              {applied.length === 0
                ? <Chip sel>All reaches</Chip>
                : applied.map(a => <Chip key={a.key} sel>{a.label}</Chip>)}
              <a href="#" onClick={e => { e.preventDefault(); onEditFilters && onEditFilters(); }} style={{ fontSize: 12, marginLeft: 6, color: THEME.accentInk }}>Edit on BID Query ›</a>
              <LegendRow style={{ marginLeft: 'auto' }} items={[{ label: 'Selection', color: THEME.ink }, { label: 'WRIA baseline', hollow: true }]} />
            </div>
            <div className="card-b">
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, minmax(0,1fr))', gap: 12 }}>
                <Kpi label="Reaches selected" value={k.n.toLocaleString()} wriaValue={wk.n.toLocaleString()} delta={<Delta a={k.n} b={wk.n} pctOf />} />
                <Kpi label="Riparian acres" value={fmtAcres(k.acres)} wriaValue={fmtAcres(wk.acres)} delta={<Delta a={k.acres} b={wk.acres} pctOf />} />
                <Kpi label={<>Mean <Term id="rp">Restoration Priority</Term></>} value={k.rpf == null ? '—' : k.rpf.toFixed(1)} wriaValue={wk.rpf == null ? '—' : wk.rpf.toFixed(1)} delta={<Delta a={k.rpf} b={wk.rpf} />} />
                <Kpi label={<>Mean <Term id="ci">Composite Index</Term></>} value={k.ci == null ? '—' : k.ci.toFixed(1)} wriaValue={wk.ci == null ? '—' : wk.ci.toFixed(1)} delta={<Delta a={k.ci} b={wk.ci} />} />
                <Kpi label={<>Mean <Term id="percentile">area percentile</Term></>} value={k.rpsa == null ? '—' : k.rpsa.toFixed(1)} wriaValue={wk.rpsa == null ? '—' : wk.rpsa.toFixed(1)} delta={<Delta a={k.rpsa} b={wk.rpsa} />} />
              </div>
              {isAll && <div className="note" style={{ marginTop: 12 }}>Showing all reaches. Run a query on the BID Query tab to compare a subset against the WRIA average.</div>}
              <div className="eyebrow" style={{ margin: '18px 0 10px' }}>Selected acres by group</div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0,1fr))', gap: '12px 28px' }}>
                <div>
                  <AcreStackBar title="Priority tier" attr="tier" sel={sel.tier} wria={g(wriaZone0.tier)} />
                  {(() => {
                    const totalN = wriaZone0.tier.reduce((a, r) => a + r.n, 0);
                    const p5n = (wriaZone0.tier.find(r => r.key === 'P5') || { n: 0 }).n;
                    const pct = totalN ? (p5n / totalN * 100) : 0;
                    return (
                      <p style={{ fontSize: 11, color: THEME.muted, margin: '4px 0 0' }}>
                        {p5n.toLocaleString()} reaches ({pct.toFixed(0)}%) are capped at P5 by fish access rather than by riparian condition.
                      </p>
                    );
                  })()}
                </div>
                <AcreStackBar title="Salmon-bearing" attr="salText" sel={sel.sal} wria={g(wriaZone0.sal)} />
                <AcreStackBar title="Temperature impairment" attr="tempText" sel={sel.temp} wria={g(wriaZone0.temp)} />
                <AcreStackBar title="Salmon Recovery Zone" attr="srz" display={displaySrz} sel={sel.srz} wria={g(wriaZone0.srz)} />
                <AcreStackBar title="Owner" attr="mgr" sel={sel.mgr} wria={g(wriaZone0.mgr)} />
                <AcreStackBar title="Zoning" attr="zon" sel={sel.zon} wria={g(wriaZone0.zon)} />
              </div>
            </div>
          </div>
          {sections.map(([title, icon, hue, sub, open, body]) => (
            <CollapsibleSection key={title} variant="section" title={title} icon={icon} hue={hue.hue} tint={hue.tint} sub={sub} defaultOpen={open}>{body}</CollapsibleSection>
          ))}
        </div>
      );
    }

    function App() {
      const [data, setData] = React.useState(null);
      const [loading, setLoading] = React.useState(true);
      const [error, setError] = React.useState(null);
      // Shared BID explorer data (17MB) — loaded once, passed to Bank Explorer + BID Query
      const [sharedBidData, setSharedBidData] = React.useState(null);
      // Applied BID Query filters — shared with SummaryStatsPanel so the stats
      // page responds to whatever the user last hit Apply on.
      const [appliedFilters, setAppliedFilters] = React.useState(null);
      // Hash-based deep linking: #bid/XXXXX opens Bank Explorer for that BID
      const initHash = window.location.hash;
      const hashBidMatch = initHash.match(/^#bid\/(.+)/);
      const [activeTab, setActiveTab] = React.useState(hashBidMatch ? 'bank_explorer' : 'bid_query');
      const [pendingBID, setPendingBID] = React.useState(hashBidMatch ? hashBidMatch[1] : null);

      // Update hash when tab or BID changes
      const updateHash = React.useCallback((tab, bid) => {
        if (tab === 'bank_explorer' && bid) {
          window.history.replaceState(null, '', `#bid/${bid}`);
        } else if (window.location.hash) {
          window.history.replaceState(null, '', window.location.pathname + window.location.search);
        }
      }, []);

      // Listen for browser back/forward with hash changes
      React.useEffect(() => {
        const onHash = () => {
          const m = window.location.hash.match(/^#bid\/(.+)/);
          if (m) {
            setActiveTab('bank_explorer');
            setPendingBID(m[1]);
          }
        };
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      React.useEffect(() => {
        fetch('./dashboard_data.json?v=' + Date.now())
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => { setData(d); setLoading(false); })
          .catch(e => { setError(e.message); setLoading(false); });
        // Load BID explorer data once (shared across Bank Explorer + BID Query)
        fetch('./bid_explorer_data.json?v=' + Date.now())
          .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
          .then(d => setSharedBidData(d))
          .catch(() => {}); // non-blocking — panels show their own loading states
      }, []);

      if (loading) return (
        <div className="flex items-center justify-center h-screen">
          <div className="text-lg" style={{ color: THEME.muted }}>Loading dashboard data...</div>
        </div>
      );
      if (error) return (
        <div className="flex items-center justify-center h-screen">
          <div className="text-center">
            <div className="text-lg mb-2" style={{ color: THEME.attn }}>Error loading data</div>
            <div className="text-sm" style={{ color: THEME.muted }}>{error}</div>
            <div className="text-xs text-gray-400 mt-4">
              Make sure dashboard_data.json exists and you're serving via HTTP<br/>
              (e.g. python -m http.server 8000)
            </div>
          </div>
        </div>
      );

      const scored = window.__stats && sharedBidData?.db ? window.__stats.kpis(sharedBidData.db, '1') : null;
      return (
        <div>
          <header style={{ background: THEME.surface, borderBottom: `1px solid ${THEME.line}` }}>
            <div style={{ maxWidth: 1320, margin: '0 auto', padding: '14px 20px 0', display: 'flex', flexDirection: 'column', gap: 10 }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', gap: 20, flexWrap: 'wrap' }}>
                <h1 style={{ fontSize: 21, fontWeight: 700, letterSpacing: '-.01em', margin: 0 }}>
                  WRIA 1 <span style={{ color: THEME.accent, fontWeight: 600 }}>Riparian Restoration Prioritization</span>
                </h1>
                <div style={{ fontSize: 12, color: THEME.muted }}>
                  Data <b style={{ color: THEME.ink2, fontWeight: 500 }}>May 2026 scoring run</b>
                  {scored && <> · <b className="num" style={{ color: THEME.ink2, fontWeight: 500 }}>{scored.n.toLocaleString()}</b> banks · <b className="num" style={{ color: THEME.ink2, fontWeight: 500 }}>{Math.round(scored.acres).toLocaleString()}</b> riparian acres</>}
                </div>
              </div>
              <nav className="tabs" role="tablist" style={{ display: 'flex', gap: 2 }}>
                {TABS.map(tab => {
                  const on = activeTab === tab.id;
                  return (
                    <button key={tab.id} role="tab" aria-selected={on} onClick={() => setActiveTab(tab.id)}
                      style={{ appearance: 'none', border: 0, background: 'none', font: `${on ? 600 : 500} 14px var(--font-b)`,
                        color: on ? THEME.accentInk : THEME.ink2, padding: '10px 14px 12px', marginBottom: -1,
                        borderBottom: `2px solid ${on ? THEME.accent : 'transparent'}`, cursor: 'pointer',
                        display: 'flex', gap: 8, alignItems: 'center' }}>
                      <Icon name={tab.icon} /> {tab.label}
                    </button>
                  );
                })}
              </nav>
            </div>
          </header>

          <main style={{ maxWidth: 1320, margin: '0 auto', padding: '18px 20px 40px' }}>
            {activeTab === 'bid_query' && <BIDQueryPanel data={data} sharedBidData={sharedBidData} appliedFilters={appliedFilters} setAppliedFilters={setAppliedFilters} onEditFilters={() => setActiveTab('bid_query')} />}
            {activeTab === 'summary_stats' && <SummaryStatsPanel data={data} sharedBidData={sharedBidData} appliedFilters={appliedFilters} onEditFilters={() => setActiveTab('bid_query')} />}
            {activeTab === 'bank_explorer' && <BankExplorerPanel data={data} sharedBidData={sharedBidData} pendingBID={pendingBID} setPendingBID={setPendingBID} onBIDSelect={(bid) => updateHash('bank_explorer', bid)} />}
            {activeTab === 'scoring_lab' && <ScoringLabPanel data={data} />}
          </main>

          <footer style={{ maxWidth: 1320, margin: '0 auto', padding: '18px 20px 34px', borderTop: `1px solid ${THEME.line}`,
            display: 'flex', justifyContent: 'space-between', gap: 16, color: THEME.muted, fontSize: 12, flexWrap: 'wrap' }}>
            <span>WRIA 1 Riparian Restoration Prioritization · Data <b style={{ color: THEME.ink2, fontWeight: 500 }}>May 2026 scoring run</b>
              {scored && <> · <b className="num" style={{ color: THEME.ink2, fontWeight: 500 }}>{scored.n.toLocaleString()}</b> banks · <b className="num" style={{ color: THEME.ink2, fontWeight: 500 }}>{Math.round(scored.acres).toLocaleString()}</b> riparian acres</>}
            </span>
            <span style={{ flexBasis: '100%' }}>Kept short for space: <b style={{ color: THEME.ink2, fontWeight: 500 }}>WRIA</b> Water Resource Inventory Area · <b style={{ color: THEME.ink2, fontWeight: 500 }}>BID</b> bank identifier · <b style={{ color: THEME.ink2, fontWeight: 500 }}>HMZ</b> Historic Migration Zone (buffer zone axes only)</span>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
