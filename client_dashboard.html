            </div>
            <ResponsiveContainer width="100%" height={320}>
              <ComposedChart data={histData} margin={{ top: 10, right: 15, left: 5, bottom: 25 }}>
                <CartesianGrid strokeDasharray="3 3" stroke={THEME.line2} />
                <XAxis dataKey="bin" type="number" domain={[0, 56]} tick={{ fontSize: 10, fill: THEME.muted }}
                  label={{ value: 'Restoration Priority (forest, 0–55)', position: 'bottom', offset: 8, fontSize: 11, fill: THEME.muted }} />
                <YAxis tick={{ fontSize: 10, fill: THEME.muted }}
                  label={{ value: 'Polygons', angle: -90, position: 'insideLeft', offset: 10, fontSize: 10, fill: THEME.muted }} />
                <Tooltip formatter={(v, name) => [fmtN(v), name === 'current' ? 'Current' : 'Default']} labelFormatter={l => `RP: ${l}-${+l + 2}`} />
                <Bar dataKey="current" fill={THEME.accent} fillOpacity={0.7} radius={[2, 2, 0, 0]} name="Current" />
                <Line dataKey="default" stroke={THEME.ghost} strokeDasharray="5 5" strokeWidth={2} dot={false} name="Default (0.35/0.35/0.30)" type="monotone" />
                <ReferenceLine x={curMean} stroke={THEME.ink} strokeDasharray="3 3" strokeWidth={1}
                  label={{ value: `mean ${curMean.toFixed(1)}`, position: 'top', fontSize: 9, fill: THEME.ink }} />
                <Legend verticalAlign="top" height={28} wrapperStyle={{ fontSize: 10 }} />
              </ComposedChart>
            </ResponsiveContainer>
            </div>
          </div>
        </div>
      );
    }

    // ============================================================
    // Bank Explorer Panel
    // ============================================================
    // Zone data format: scored = [lc0..lc8, sqft, comp, ht, den, zrp, comp_std] (15 values)
    //                   channel = [lc0..lc8, sqft] (10 values) at index 5
    // Zone order: [50, 100, 300, hmz, hmz300, channel] - null if missing
    const BE_ZONE_LABELS = ['0–50 ft', '50–100 ft', '100–300 ft', 'HMZ', 'HMZ+300'];
    const BE_ZONE_WEIGHTS = [10, 6, 3, 2, 1]; // must match preprocessor ZONE_WEIGHTS
    const BE_LC_LABELS = LC_LABELS_9;
    const BE_CH_COLS = 4; // column count for channel/lake grid

    function buildBankZoneGrid(zd, cols, zi) {
      // Build deterministic grid cells for one zone section
      // Colors are stacked as horizontal bands (row-based fill) so each LC type
      // forms a contiguous stripe across the zone width.
      // Forest cells use composition distribution (mean ± std) for a gradient from
      // conifer (dark green) to deciduous (brown), plus fractal noise for texture.
      // Each cell: { lc, bri, comp, pct }
      const totalCells = cols * GRID_ROWS;
      const cells = [];
      if (!zd) {
        for (let i = 0; i < totalCells; i++) cells.push({ lc: -1, bri: 0.3, comp: 0, pct: 0 });
        return cells;
      }
      const lcProbs = zd.slice(0, 9);
      const zComp = zd.length >= 11 ? zd[10] : 0; // mean composition
      const zCompStd = zd.length >= 15 ? zd[14] : 0.15; // composition std dev

      // Sort LC: non-scored at top, lowest scoring covers next, best (forest) at bottom
      // Priority (lower = top of grid): Railway(8)→Gravel(7)→Water(6)→CoI(5)→Imperv(4)→Herb(3)→Shrub(2)→ShrubWd(1)→Forest(0)
      const BE_LC_SORT = [9, 8, 7, 6, 1, 2, 3, 4, 5]; // index→priority (forest=9=bottom, railway=5=near top)
      const sorted = lcProbs.map((p, i) => ({ idx: i, p }))
        .filter(x => x.p > 0.001)
        .sort((a, b) => BE_LC_SORT[a.idx] - BE_LC_SORT[b.idx]);

      // Assign cells row-by-row (row-major) so each LC type forms horizontal bands
      let filled = 0;
      const lastLC = sorted.length > 0 ? sorted[sorted.length - 1].idx : 6;
      const cellAssign = new Array(totalCells).fill(lastLC); // default to bottom (best) LC
      for (const { idx, p } of sorted) {
        const count = Math.round(p * totalCells);
        for (let j = 0; j < count && filled < totalCells; j++) {
          cellAssign[filled] = idx;
          filled++;
        }
      }
      if (filled < totalCells && sorted.length > 0) {
        for (; filled < totalCells; filled++) cellAssign[filled] = lastLC;
      }

      // Find the range of rows that are forest (lc=0) for gradient mapping
      const forestStart = cellAssign.indexOf(0);
      const forestEnd = cellAssign.lastIndexOf(0);
      const forestSpan = forestEnd > forestStart ? forestEnd - forestStart : 1;

      // Build cells in row-major order - cellAssign is already row-major
      for (let r = 0; r < GRID_ROWS; r++) {
        for (let c = 0; c < cols; c++) {
          const cellIdx = r * cols + c; // row-major: fills horizontally first
          const lc = cellAssign[cellIdx] !== undefined ? cellAssign[cellIdx] : 6;
          const bri = 0.88 + lcHash(c + zi * 50, r, zi * 1234 + 5678) * 0.24;
          let comp = 0;
          if (lc === 0) {
            // Gradient: spread forest cells across comp_mean ± 1.5*std
            // Bottom of forest band = more coniferous (higher comp), top = more deciduous
            const pos = forestSpan > 0 ? (cellIdx - forestStart) / forestSpan : 0.5;
            const gradientComp = zComp + (pos - 0.5) * zCompStd * 3; // bottom=+1.5σ, top=-1.5σ
            // Add fractal noise for natural texture
            const noise = (fNoise(c * 0.25, r * 0.25, zi * 997 + 55555) - 0.5) * zCompStd * 1.2;
            comp = Math.max(-1, Math.min(1, gradientComp + noise));
          }
          cells.push({ lc, bri, comp, pct: lcProbs[lc] || 0 });
        }
      }
      return cells;
    }

    function buildBankGrid(zoneArrays) {
      // Build grid cells for all 5 scored zones
      const zones = [];
      for (let zi = 0; zi < 5; zi++) {
        zones.push(buildBankZoneGrid(zoneArrays[zi], GRID_ZONE_COLS[zi], zi));
      }
      return zones;
    }

    function buildChannelGrid(chData) {
      // Build grid cells for channel/lake zone (index 5, 10-value format)
      return buildBankZoneGrid(chData, BE_CH_COLS, 5);
    }

    // --- SQL helpers: query BID data from sqlite ---
    // Note: sql.js db.exec() uses named params as object, e.g. {$bid: 'AC100_1'}
    function sqlQueryBidAttr(db, bid) {
      try {
        if (!db || !bid) return null;
        const r = db.exec("SELECT * FROM bids WHERE bid = $bid", { $bid: bid });
        if (!r.length || !r[0].values.length) return null;
        const cols = r[0].columns;
        const vals = r[0].values[0];
        const a = {};
        cols.forEach((c, i) => { a[c] = vals[i]; });
        a.hmz = !!a.hmz; a.ti = !!a.ti; a.di = !!a.di; a.ai = !!a.ai;
        return a;
      } catch (e) { console.error('sqlQueryBidAttr error:', e); return null; }
    }
    function sqlQueryBidZones(db, bid) {
      try {
        if (!db || !bid) return null;
        // Rebuilds the zone arrays the panels consume:
        //   scored zones 0-4: [lc0..lc8, sqft, comp, ht, den, zrp, comp_std]  (15 values)
        //   channel zone 5:   [lc0..lc8, sqft]                                  (10 values)
        const r = db.exec(
          "SELECT z, sqft, lc0, lc1, lc2, lc3, lc4, lc5, lc6, lc7, lc8, comp, ht, den, zrp, cstd " +
          "FROM zones WHERE bid = $bid ORDER BY z", { $bid: bid });
        const zones = [null, null, null, null, null, null];
        if (r.length) r[0].values.forEach(([z, sqft, ...rest]) => {
          const lc = rest.slice(0, 9), tail = rest.slice(9);
          zones[z] = z === 5 ? [...lc, sqft] : [...lc, sqft, ...tail];
        });
        return zones;
      } catch (e) { console.error('sqlQueryBidZones error:', e); return null; }
    }
    function sqlSearchBids(db, term) {
      try {
        if (!db || !term) return [];
        const esc = v => "'" + String(v).replace(/'/g, "''") + "'";
        const like = esc(term + '%');
        const contains = esc('%' + term + '%');
        const r = db.exec(
          `SELECT bid, str, srz, rpsf, tier FROM bids
           WHERE bid LIKE ${like} OR str LIKE ${like} OR srz LIKE ${like}
              OR bid LIKE ${contains} OR str LIKE ${contains} OR srz LIKE ${contains}
           ORDER BY CASE WHEN bid LIKE ${like} OR str LIKE ${like} OR srz LIKE ${like} THEN 0 ELSE 1 END, bid
           LIMIT 50`
        );
        if (!r.length) return [];
        return r[0].values.map(([bid, str, srz, rpsf, tier]) => ({ bid, str, srz, rpsf, tier }));
      } catch (e) { console.error('sqlSearchBids error:', e); return []; }
    }
    // A truthy `db` is not necessarily a usable one: sharedBidData can be populated a tick
    // before sql.js finishes initialising, so every guard must test for the method it is
    // about to call, not merely for the object. A bare truthiness guard threw
    // "db.exec is not a function" ~5x on every page load.
    const dbReady = (db) => !!db && typeof db.exec === 'function';

    function sqlBidCount(db) {
      try {
        if (!dbReady(db)) return 0;
        const r = db.exec("SELECT COUNT(*) FROM bids");
        return r.length ? r[0].values[0][0] : 0;
      } catch (e) { console.error('sqlBidCount error:', e); return 0; }
    }

    // All BIDs on the same RID (reach), sorted by Final Restoration Priority descending. Includes the current BID.
    // CI is computed inline (rpsf * rpsa / 100) since it isn't a stored column in the SQLite.
    // Uses rpsf, matching the RP the panel shows for the selected BID above. It previously
    // read the linear rpf column, so the same reach could show one RP in the header and a
    // slightly different one in its own sibling list.
    function sqlReachSiblings(db, rid) {
      try {
        if (!db || !rid) return [];
        const esc = v => "'" + String(v).replace(/'/g, "''") + "'";
        const r = db.exec(
          `SELECT bid, rpsf, sols, asp, af, ROUND(rpsf * rpsa / 100.0, 1) AS ci FROM bids
           WHERE rid = ${esc(rid)}
           ORDER BY rpsf DESC`
        );
        if (!r.length) return [];
        return r[0].values.map(([bid, rpsf, sols, asp, af, ci]) => ({ bid, rpsf, sols, asp, af, ci }));
      } catch (e) { console.error('sqlReachSiblings error:', e); return []; }
    }

    // In-channel (waterbody) BIDs on the same RID — these were filtered out of scoring but
    // we surface them in the Reach Context card with their landcover composition for context.
    function sqlReachWaterbodyBids(db, rid) {
      try {
        if (!db || !rid) return [];
        const esc = v => "'" + String(v).replace(/'/g, "''") + "'";
        const r = db.exec(
          `SELECT bid, lc, sqft, wt FROM waterbody_bids WHERE rid = ${esc(rid)} ORDER BY bid`
        );
        if (!r.length) return [];
        return r[0].values.map(([bid, lc, sqft, wt]) => {
          let lcArr = [0,0,0,0,0,0,0,0,0];
          try { lcArr = JSON.parse(lc); } catch (_) {}
          return { bid, lc: lcArr, sqft, wt };
        });
      } catch (e) { console.error('sqlReachWaterbodyBids error:', e); return []; }
    }

    // 16-point compass abbreviation for an aspect angle in degrees (0/360 = N).
    const aspectCompass = (deg) => {
      if (deg == null || isNaN(deg)) return '';
      const dirs = ['N','NNE','NE','ENE','E','ESE','SE','SSE',
                    'S','SSW','SW','WSW','W','WNW','NW','NNW'];
      return dirs[Math.round((((deg % 360) + 360) % 360) / 22.5) % 16];
    };

    function BankExplorerPanel({ data, sharedBidData, pendingBID, setPendingBID, onBIDSelect }) {
      const db = sharedBidData?.db || null;
      const bidLoading = !db;
      const [selectedBID, setSelectedBID] = React.useState(null);
      const [searchTerm, setSearchTerm] = React.useState('');

      // Wrapper that selects BID and notifies parent for hash update
      const selectBID = React.useCallback((bid) => {
        setSelectedBID(bid);
        if (onBIDSelect) onBIDSelect(bid);
      }, [onBIDSelect]);

      // Accept BID navigation from BID Query tab or hash deep link
      // Wait for db to be ready before processing pendingBID
      React.useEffect(() => {
        if (pendingBID && db) {
          selectBID(pendingBID);
          setSearchTerm(pendingBID);
          setShowDropdown(false);
          setPendingBID(null);
        }
      }, [pendingBID, db]);
      const [showDropdown, setShowDropdown] = React.useState(false);
      const [beHover, setBeHover] = React.useState(null);
      const searchRef = React.useRef(null);

      // Close dropdown on outside click
      React.useEffect(() => {
        const handler = (e) => {
          if (searchRef.current && !searchRef.current.contains(e.target)) setShowDropdown(false);
        };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);

      // SQL-backed data lookups (all hooks MUST be before any early returns)
      const attr = React.useMemo(() => sqlQueryBidAttr(db, selectedBID), [db, selectedBID]);
      const zoneArrays = React.useMemo(() => sqlQueryBidZones(db, selectedBID), [db, selectedBID]);
      const totalBidCount = React.useMemo(() => sqlBidCount(db), [db]);
      // All BIDs on the same RID (sorted by Final Restoration Priority desc), used by the Reach Context card.
      const siblings = React.useMemo(() => {
        if (!db || !attr || !attr.rid) return [];
        return sqlReachSiblings(db, attr.rid);
      }, [db, attr]);
      // In-channel (waterbody) BIDs on the same RID — filtered out of scoring, surfaced for context.
      const waterbodyBids = React.useMemo(() => {
        if (!db || !attr || !attr.rid) return [];
        return sqlReachWaterbodyBids(db, attr.rid);
      }, [db, attr]);
      const filtered = React.useMemo(() => {
        if (searchTerm.length === 0 || !db) return [];
        return sqlSearchBids(db, searchTerm);
      }, [searchTerm, db]);

      if (bidLoading) return (
        <div className="flex items-center justify-center py-12">
          <div className="text-gray-500">Loading Bank Explorer data...</div>
        </div>
      );
      const gridZones = zoneArrays ? buildBankGrid(zoneArrays) : null;
      const chData = zoneArrays ? zoneArrays[5] : null;
      const chCells = chData ? buildChannelGrid(chData) : null;
      const waterType = attr ? attr.wt : '';
      const chLabel = waterType === 'lake' ? 'Lake' : waterType === 'river' ? 'Channel' : '';
      const totalWeight = zoneArrays ? BE_ZONE_WEIGHTS.reduce((s, w, i) => s + (zoneArrays[i] ? w : 0), 0) : 0;

      return (
        <div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 16, marginBottom: 14, flexWrap: 'wrap' }}>
            <h2 style={{ fontSize: 17, fontWeight: 600, margin: 0 }}>Bank Explorer</h2>
            <p style={{ margin: 0, color: THEME.muted, fontSize: 13 }}>Search by BID, stream name, or Salmon Recovery Zone. Deep link: append <span className="num">#bid/AC334_4</span> to the page URL.</p>
          </div>
          <div ref={searchRef} style={{ position: 'relative', marginBottom: 14, maxWidth: 520 }}>
            <input type="text" value={searchTerm} aria-label="Search banks"
              onChange={e => { setSearchTerm(e.target.value); setShowDropdown(true); }}
              onFocus={() => searchTerm.length > 0 && setShowDropdown(true)}
              placeholder="Search by BID, stream name, or Salmon Recovery Zone"
              style={{ width: '100%', font: '14px var(--font-b)', padding: '8px 12px', border: `1px solid ${THEME.line}`, borderRadius: 5, background: THEME.surface, color: THEME.ink }} />
            {showDropdown && filtered.length > 0 && (
              <div className="card" style={{ position: 'absolute', zIndex: 50, width: '100%', marginTop: 4, maxHeight: 320, overflowY: 'auto', boxShadow: '0 8px 24px rgba(22,58,74,.12)' }}>
                {filtered.map(a => (
                  <button key={a.bid} type="button" onClick={() => { selectBID(a.bid); setSearchTerm(a.bid); setShowDropdown(false); }}
                    style={{ width: '100%', textAlign: 'left', padding: '8px 12px', fontSize: 13, background: 'none', border: 0, borderBottom: `1px solid ${THEME.line2}`, cursor: 'pointer', display: 'flex', gap: 8, alignItems: 'center' }}>
                    <span className="num" style={{ fontWeight: 500, color: THEME.accentInk }}>{a.bid}</span>
                    <span style={{ color: THEME.ink2 }}>{a.str || 'Unknown'}</span>
                    <span style={{ color: THEME.muted, fontSize: 12 }}>{displaySrz(a.srz)}</span>
                    <span style={{ marginLeft: 'auto', display: 'flex', gap: 8, alignItems: 'center' }}>
                      <span className="num" style={{ fontSize: 12, color: THEME.ink2 }}>{a.rpsf}</span><TierPill tier={a.tier} />
                    </span>
                  </button>
                ))}
                {filtered.length === 50 && <div style={{ padding: '6px 12px', fontSize: 11.5, color: THEME.muted, textAlign: 'center' }}>Showing the first 50 matches - refine your search</div>}
              </div>
            )}
          </div>
          {!selectedBID && (
            <div className="card" style={{ padding: 40, textAlign: 'center', color: THEME.muted }}>
              <Icon name="search" size={28} style={{ color: THEME.faint }} />
              <div style={{ fontSize: 13, marginTop: 8 }}>Select a bank above to explore its landcover composition and attributes</div>
              <div className="num" style={{ fontSize: 12, marginTop: 4 }}>{fmtN(totalBidCount)} banks available</div>
            </div>
          )}

          {selectedBID && attr && gridZones && (
            <div>
              {/* BID Header */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap', marginBottom: 14 }}>
                <span className="num" style={{ font: '600 22px var(--font-h)', color: THEME.ink }}>{selectedBID}</span>
                <span style={{ color: THEME.muted }}>{attr.str || 'Unknown stream'}</span>
                <TierPill tier={attr.tier} />
                <Chip dot color={colorOf('srz', attr.srz)}>{displaySrz(attr.srz)}</Chip>
                {attr.chk === 'Y' && <Chip dot color={THEME.sections.fish.hue}>Early Chinook</Chip>}
                {attr.fish === 'fish' && <Chip dot color={THEME.sections.fish.hue}>Fish-bearing</Chip>}
                <div style={{ marginLeft: 'auto', textAlign: 'right' }}>
                  <div className="num" style={{ font: '600 30px/1 var(--font-h)', color: THEME.accentInk }}>{attr.rpsf}</div>
                  <div style={{ fontSize: 11, color: THEME.muted }}><Term id="rp">Restoration Priority</Term>{siblings.length > 1 && <> · rank <span className="num">{siblings.findIndex(s => s.bid === selectedBID) + 1} of {siblings.length}</span> on reach {attr.rid}</>}</div>
                </div>
              </div>

              {/* Grid + Score side by side */}
              <div className="be" style={{ marginBottom: 18 }}>
                {/* Landcover Grid */}
                <div className="card">
                  <div className="card-h">
                    <h3>Landcover composition by zone</h3>
                    <span style={{ fontSize: 11.5, color: THEME.muted }}>← Channel · Upland →</span>
                  </div>
                  <div className="card-b">
                    {/* The zone grid is built from fixed 10px cells across ~54 columns, so its
                        intrinsic width (~772px) cannot shrink. Without its own scroll container it
                        forced the whole PAGE to scroll horizontally at tablet width - 822px against a
                        768px viewport - which matters because AGOL popups deep-link straight into this
                        populated view. Wide content scrolls inside itself; the body never does. */}
                    <div style={{ overflowX: 'auto', maxWidth: '100%' }}>
                    <div style={{ display: 'flex', gap: 3, justifyContent: 'center', alignItems: 'flex-start', width: 'max-content', minWidth: '100%' }}>
                      {/* Channel/Lake column (left of 0-50ft) */}
                      {chCells ? (
                        <div>
                          <div style={{
                            display: 'grid',
                            gridTemplateColumns: `repeat(${BE_CH_COLS}, 10px)`,
                            gridTemplateRows: `repeat(${GRID_ROWS}, 10px)`,
                            gap: 1,
                            background: THEME.line,
                            padding: 1,
                            borderRadius: 3,
                          }}>
                            {chCells.map((cell, ci) => (
                              <div key={ci} className={cell.lc > 0 ? lcTextureClass(cell.lc) : ''}
                                onMouseEnter={() => setBeHover(cell.lc >= 0 ? {
                                  lcName: BE_LC_LABELS[cell.lc], pct: cell.pct,
                                  zoneName: chLabel, zrp: null, rpContrib: null,
                                  comp: cell.lc === 0 ? cell.comp : null,
                                } : null)}
                                onMouseLeave={() => setBeHover(null)}
                                style={{
                                  width: 10, height: 10, borderRadius: 1,
                                  backgroundColor: cell.lc < 0 ? THEME.line2
                                    : cell.lc === 0 ? compToColor(cell.comp)
                                    : LAB_LC_FILLS[cell.lc],
                                  opacity: cell.lc < 0 ? 1 : cell.bri, cursor: 'crosshair',
                                }} />
                            ))}
                          </div>
                          <div className="text-center mt-1" style={{ fontSize: 9, color: THEME.accentInk }}>
                            {chLabel}
                          </div>
                        </div>
                      ) : waterType === '' && attr ? (
                        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', height: GRID_ROWS * 11 + 2, minWidth: 30 }}>
                          <div style={{ writingMode: 'vertical-rl', transform: 'rotate(180deg)', fontSize: 9, color: THEME.accentInk, letterSpacing: 1 }}>Stream</div>
                        </div>
                      ) : null}

                      {/* Divider between channel and scored zones */}
                      {(chCells || waterType === '') && attr && (
                        <div style={{ width: 1, background: THEME.line, marginTop: 0, marginBottom: 14, borderRadius: 1 }}></div>
                      )}

                      {/* Scored zone columns */}
                      {gridZones.map((cells, zi) => {
                        const cols = GRID_ZONE_COLS[zi];
                        const zd = zoneArrays[zi];
                        const zrp = zd && zd.length >= 14 ? zd[13] : null; // zone RP at index 13
                        const rpContrib = zrp != null && totalWeight > 0
                          ? (zrp * BE_ZONE_WEIGHTS[zi] / totalWeight).toFixed(1)
                          : null;
                        return (
                          <div key={zi} style={{ opacity: zd ? 1 : 0.3 }}>
                            <div style={{
                              display: 'grid',
                              gridTemplateColumns: `repeat(${cols}, 10px)`,
                              gridTemplateRows: `repeat(${GRID_ROWS}, 10px)`,
                              gap: 1,
                              background: THEME.line,
                              padding: 1,
                              borderRadius: 3,
                            }}>
                              {cells.map((cell, ci) => (
                                <div key={ci} className={cell.lc > 0 ? lcTextureClass(cell.lc) : ''}
                                  onMouseEnter={() => setBeHover(cell.lc >= 0 ? {
                                    lcName: BE_LC_LABELS[cell.lc], pct: cell.pct,
                                    zoneName: BE_ZONE_LABELS[zi], zrp, rpContrib,
                                    comp: cell.lc === 0 ? cell.comp : null,
                                  } : null)}
                                  onMouseLeave={() => setBeHover(null)}
                                  style={{
                                    width: 10, height: 10, borderRadius: 1,
                                    backgroundColor: cell.lc < 0 ? THEME.line2
                                      : cell.lc === 0 ? compToColor(cell.comp)
                                      : LAB_LC_FILLS[cell.lc],
                                    opacity: cell.lc < 0 ? 1 : cell.bri, cursor: 'crosshair',
                                  }} />
                              ))}
                            </div>
                            <div className="text-center mt-1" style={{ fontSize: 9, color: THEME.muted }}>
                              {BE_ZONE_LABELS[zi]}
                            </div>
                          </div>
                        );
                      })}

                      {/* Hover tooltip panel */}
                      <div style={{ minWidth: 140, marginLeft: 10, paddingTop: 0 }}>
                        {beHover ? (
                          <div className="tip" style={{ position: 'static', whiteSpace: 'normal' }}>
                            <div style={{ fontWeight: 600, marginBottom: 3, color: THEME.ink }}>{beHover.lcName}</div>
                            <div className="text-gray-600" style={{ marginBottom: 2 }}>
                              <span className="text-gray-400">{beHover.zoneName}:</span>{' '}
                              <span className="font-mono font-semibold">{(beHover.pct * 100).toFixed(1)}%</span>
                            </div>
                            {beHover.comp != null && (
                              <div className="text-gray-600" style={{ marginBottom: 2 }}>
                                <span className="text-gray-400">Composition:</span>{' '}
                                <span className="font-mono">{beHover.comp.toFixed(2)}</span>
                              </div>
                            )}
                            {beHover.zrp != null && (
                              <div className="text-gray-600" style={{ marginBottom: 2 }}>
                                <span className="text-gray-400">Zone Restoration Priority:</span>{' '}
                                <span className="font-mono font-semibold">{beHover.zrp}</span>
                              </div>
                            )}
                            {beHover.rpContrib != null && (
                              <div className="text-gray-600">
                                <span className="text-gray-400">Contribution:</span>{' '}
                                <span className="font-mono font-semibold" style={{ color: THEME.accentInk }}>{beHover.rpContrib} pts</span>
                              </div>
                            )}
                          </div>
                        ) : null}
                      </div>
                    </div>
                    </div>
                    {/* LC Legend - matches Score Lab */}
                    <div style={{ display: 'flex', gap: 22, alignItems: 'center', marginTop: 14, flexWrap: 'wrap' }}>
                      <div style={{ minWidth: 220, flex: 1 }}>
                        <div style={{ height: 10, borderRadius: 3, border: `1px solid ${THEME.line}`, background: `linear-gradient(90deg, ${COMP_POLES.conifer}, ${COMP_POLES.mid} 50%, ${COMP_POLES.deciduous})` }} />
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 10.5, color: THEME.muted, marginTop: 3 }}>
                          <span>Conifer</span><span style={{ color: THEME.ink2, fontWeight: 500 }}><Term id="comp">Mixed (0) = the Forest colour</Term></span><span>Deciduous</span>
                        </div>
                      </div>
                      <LegendRow items={LC9.slice(1).map(l => ({ label: l.key, color: l.color, texture: l.texture }))} />
                    </div>
                  </div>
                </div>

                {/* Score Breakdown Card */}
                <div className="card">
                  <div className="card-h"><h3>Score breakdown</h3></div>
                  <div className="card-b">
                  <table className="tbl compact">
                    <tbody>
                      <tr className="border-b">
                        <td>Base <Term id="rp">Restoration Priority</Term></td>
                        <td className="n">{attr.rpsn}</td>
                      </tr>
                      <tr className="border-b">
                        <td><Term id="push">Solar push</Term></td>
                        <td className="n" style={{ color: THEME.accentInk }}>+{(attr.sols ?? 0).toFixed(1)}</td>
                      </tr>
                      {attr.asp != null && (
                        <tr className="border-b">
                          <td className="py-1 pl-3 text-xs text-gray-400 italic">aspect {attr.asp}° ({aspectCompass(attr.asp)}) → factor {(attr.af >= 0 ? '+' : '') + (attr.af ?? 0).toFixed(2)}</td>
                          <td className="n" style={{ fontSize: 11, fontStyle: 'italic', color: THEME.muted }}>
                            {attr.af > 0.05 ? '(boost)' : attr.af < -0.05 ? '(reduction)' : '(neutral)'}
                          </td>
                        </tr>
                      )}
                      <tr className="border-b">
                        <td>Slope push</td>
                        <td className="n" style={{ color: THEME.accentInk }}>+{(attr.slps ?? 0).toFixed(1)}</td>
                      </tr>
                      <tr className="border-b">
                        <td>Wetland push</td>
                        <td className="n" style={{ color: THEME.accentInk }}>+{attr.wet}</td>
                      </tr>
                      <tr className="tot">
                        <td>Restoration Priority</td>
                        <td className="n" style={{ color: THEME.accentInk, fontSize: 15 }}>{attr.rpsf}</td>
                      </tr>
                      {attr.rpsa != null && (
                        <tr className="border-t">
                          <td><Term id="percentile">Area percentile</Term></td>
                          <td className="n">{Math.round(attr.rpsa)}</td>
                        </tr>
                      )}
                      <tr>
                        <td><Term id="ci">Composite Index</Term></td>
                        <td className="n">{(attr.rpsf * attr.rpsa / 100).toFixed(1)}</td>
                      </tr>
                    </tbody>
                  </table>
                  <div className="mt-3 pt-3 border-t">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xs text-gray-500">Tier</span>
                      <TierPill tier={attr.tier} />
                    </div>
                    {(() => {
                      const NOOK_ZONES = new Set(["Lower Mainstem Nooksack","Upper Mainstem Nooksack","Lower NF Nooksack","Upper NF Nooksack","Lower MF Nooksack","Upper MF Nooksack","Lower SF Nooksack","Upper SF Nooksack"]);
                      const isNook = NOOK_ZONES.has(attr.srz);
                      const isChin = attr.chk === 'Y';
                      const isFish = attr.fish === 'fish';
                      const isTemp = attr.ti;
                      const checks = [
                        { label: 'Early Chinook', met: isChin },
                        { label: 'Nooksack', met: isNook },
                        { label: 'Fish-bearing', met: isFish },
                        { label: 'Temperature impaired', met: isTemp },
                      ];
                      const tierDesc = {
                        P1: 'Early Chinook + Nooksack + temperature-impaired',
                        P2: isChin && isNook ? 'Early Chinook + Nooksack (no temperature impairment)' : 'Fish-bearing + temperature-impaired (no Early Chinook)',
                        P3: isFish && isNook ? 'Fish-bearing + Nooksack (no Early Chinook, no temperature impairment)' : 'Fish-bearing + non-Nooksack, temperature-impaired',
                        P4: 'Fish-bearing + non-Nooksack (no temperature impairment)',
                        P5: 'Gradient-accessible only',
                      };
                      return (
                        <div>
                          <div className="flex flex-wrap gap-1.5 mb-1.5">
                            {checks.map(c => (
                              <Chip key={c.label} on={c.met} off={!c.met} color={THEME.sections.fish.hue}>{c.met ? '\u2713 ' : ''}{c.label}</Chip>
                            ))}
                          </div>
                          <div className="text-xs text-gray-500 italic">{tierDesc[attr.tier] || '-'}</div>
                        </div>
                      );
                    })()}
                  </div>
                  </div>
                </div>
              </div>

              {/* Info panels */}
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                {/* Location & Classification */}
                <div className="card">

    function DualRangeSlider({ label, min, max, step, value, onChange, fmt, term }) {
      // Local state for smooth dragging — only propagates on mouse/touch release
      const [localVal, setLocalVal] = React.useState(value);
      const dragging = React.useRef(false);
      React.useEffect(() => { if (!dragging.current) setLocalVal(value); }, [value]);
      const [lo, hi] = localVal;
      const pctLo = ((lo - min) / (max - min)) * 100;
      const pctHi = ((hi - min) / (max - min)) * 100;
      const display = fmt || (v => v);
      const commitLo = () => { dragging.current = false; onChange([lo, hi]); };
      const commitHi = () => { dragging.current = false; onChange([lo, hi]); };
      return (
        <div style={{ marginBottom: 5 }}>
          <div className="fl" style={{ margin: '4px 0 2px' }}>
            <span>{term ? <Term id={term}>{label}</Term> : label}</span>
            <span className="num">{display(lo)} – {display(hi)}</span>
          </div>
          <div className="drs">
            <div className="track" />
            <div className="range" style={{ left: `${pctLo}%`, width: `${pctHi - pctLo}%` }} />
            <input type="range" min={min} max={max} step={step} value={lo} aria-label={`${label} minimum`}
              onInput={e => { dragging.current = true; const v = +e.target.value; setLocalVal([Math.min(v, hi), hi]); }}
              onChange={() => {}} onMouseUp={commitLo} onTouchEnd={commitLo} />
            <input type="range" min={min} max={max} step={step} value={hi} aria-label={`${label} maximum`}
              onInput={e => { dragging.current = true; const v = +e.target.value; setLocalVal([lo, Math.max(v, lo)]); }}
              onChange={() => {}} onMouseUp={commitHi} onTouchEnd={commitHi} />
          </div>
        </div>
      );
    }

    // Two skins, one behaviour: `{open && children}` means a closed section renders nothing
    // and therefore runs no queries. variant="section" is the Summary Stats card with a hue
    // stripe and icon tile; the default is the compact filter-group header used in the rail.
    function CollapsibleSection({ title, defaultOpen = true, badge, hue, tint, icon, sub, variant = 'group', children }) {
      const [open, setOpen] = React.useState(defaultOpen);
      const c = hue || THEME.accent, ct = tint || THEME.accentTint;
      if (variant === 'section') return (
        <div className={`card sec ${open ? 'open' : ''}`} style={{ '--c': c, '--ct': ct }}>
          <button type="button" className="sh" onClick={() => setOpen(!open)} aria-expanded={open}>
            {icon && <span className="ic"><Icon name={icon} size={15} /></span>}
            <h3>{title}</h3>
            {sub && <span className="sub">{sub}</span>}
            {badge != null && badge > 0 && <Badge>{badge}</Badge>}
            <span className="chev"><Icon name="chevron" size={14} /></span>
          </button>
          {open && <div className="sb">{children}</div>}
        </div>
      );
      return (
        <div className={`fgroup ${open ? 'open' : ''}`} style={{ '--c': c }}>
          <button type="button" onClick={() => setOpen(!open)} aria-expanded={open}>
            <span className="stripe" />
            {title}
            {badge != null && badge > 0 && <Badge>{badge}</Badge>}
            <span className="chev"><Icon name="chevron" size={14} /></span>
          </button>
          {open && <div className="fb">{children}</div>}
        </div>
      );
    }

    // --- SQL helper: build WHERE clause from BID Query filters ---
    // Note: sql.js db.exec() uses named params or no params. We inline values safely
    // since all values come from our own controlled UI state (no user-typed SQL).
    // The nine salmon species, in display order. Single source of truth: the BID Query
    // species filter, its label set, and the stats layer's per-species acreage all read
    // this. Order and spelling must match the semicolon-joined values in the `sps` column,
    // because both the filter and the stats layer match with LIKE '%<name>%'.
    const SALMON_SPECIES = [
      'Spring Chinook', 'Fall Chinook', 'Coho',
      'Summer Steelhead', 'Winter Steelhead', 'Fall Chum',
      'Pink (Odd Year)', 'Sockeye', 'Dolly Varden / Bull Trout',
    ];

    function buildBidQueryWhere(f) {
      const clauses = [];
      const esc = v => "'" + String(v).replace(/'/g, "''") + "'";
      const addSet = (col, set, allLabels) => {
        if (!set || set.size === 0) { clauses.push('0'); return; }
        if (set.size < allLabels.length) {
          clauses.push(`${col} IN (${[...set].map(v => esc(v)).join(',')})`);
        }
      };
      const addBoolSet = (col, set) => {
        if (!set || set.size === 0) { clauses.push('0'); return; }
        if (set.size === 1) {
          clauses.push(set.has('Y') ? `${col} = 1` : `${col} = 0`);
        }
      };
      const addRange = (col, range) => {
        clauses.push(`${col} >= ${+range[0]} AND ${col} <= ${+range[1]}`);
      };
      addSet('tier', f.selTier, f._labels?.tier || []);
      addSet('chk', f.selChk, f._labels?.chk || []);
      addSet('fish', f.selFish, f._labels?.fish || []);
      addSet('srz', f.selSrz, f._labels?.srz || []);
      addSet('mgr', f.selMgr, f._labels?.mgr || []);
      addSet('zon', f.selZon, f._labels?.zon || []);
      addSet('bfw', f.selBfw, f._labels?.bfw || []);
      addBoolSet('hmz', f.selHmz);
      addBoolSet('sal', f.selSal);
      // Salmon species multi-select: if a strict subset is selected, filter to BIDs whose
      // sps (semicolon-list) contains ANY of the selected species (OR-combined LIKE clauses).
      if (f.selSpecies && f.selSpecies.size > 0 && f.selSpecies.size < SALMON_SPECIES.length) {
        const ors = [...f.selSpecies].map(sp => `sps LIKE ${esc('%' + sp + '%')}`);
        clauses.push('(' + ors.join(' OR ') + ')');
      } else if (f.selSpecies && f.selSpecies.size === 0) {
        clauses.push('0'); // explicitly nothing selected
      }
      // For impairment categories: filter applies only when impaired=True; if all cats selected,
      // we ALSO want to include non-impaired BIDs (cat is null/empty). If a subset is selected,
      // we restrict to impaired BIDs with that cat OR include non-impaired only when 'N' is selected.
      // Simpler approach: only filter cats if user has a strict subset selected (not all available).
      const addCatSet = (col, set, allLabels) => {
        if (!set || set.size === 0) { clauses.push('0'); return; }
        if (set.size < allLabels.length) {
          clauses.push(`${col} IN (${[...set].map(v => esc(v)).join(',')})`);
        }
      };
      addCatSet('tic', f.selTcat, f._labels?.tcat || []);
      addCatSet('fic', f.selFcat, f._labels?.fcat || []);
      addCatSet('sic', f.selScat, f._labels?.scat || []);
      // Waterbody type: SQLite stores raw values 'river'/'lake'/'' but UI shows 'Active Channel'/'Lake'/'Tributary'.
      // Translate selected display labels back to raw values for the IN clause.
      const WT_RAW_MAP = { 'Active Channel': 'river', 'Tributary': '', 'Lake': 'lake' };
      if (!f.selWT || f.selWT.size === 0) {
        clauses.push('0');
      } else if (f.selWT.size < 3) {
        const raws = [...f.selWT].map(lbl => WT_RAW_MAP[lbl] ?? '');
        clauses.push(`(wt IS NOT NULL AND wt IN (${raws.map(esc).join(',')}))`);
      }
      // S-curve columns throughout: rpsf/rpsa are the canonical scores (the tiers and
      // the Composite Index are built on them).
      addRange('rpsf', f.rRPF);
      addRange('rpsa', f.rRPA);
      addRange('mc', f.rComp);
      addRange('mh', f.rCH);
      addRange('sols', f.rSol);
      addRange('slps', f.rSlp);
      addRange('wet', f.rWet);
      addRange('pf', f.rPF);
      addRange('ps', f.rPS);
      addRange('ph', f.rPH);
      // pctRest = pf + ps + ph (computed)
      clauses.push(`MIN(100, ROUND(pf + ps + ph)) >= ${+f.rRest[0]} AND MIN(100, ROUND(pf + ps + ph)) <= ${+f.rRest[1]}`);
      // Composite Index (CI = rpsf * rpsa / 100): filter on the same expression used as the default sort
      clauses.push(`ROUND(rpsf * rpsa / 100.0, 1) >= ${+f.rCI[0]} AND ROUND(rpsf * rpsa / 100.0, 1) <= ${+f.rCI[1]}`);
      return clauses.length ? clauses.join(' AND ') : '1';
    }

    const RANGE_DEFAULTS = {
      rRPF: [0, 100], rRPA: [0, 100], rComp: [-1, 1], rCH: [0, 300], rSol: [0, 12], rSlp: [0, 5],
      rWet: [0, 5], rPF: [0, 100], rPS: [0, 100], rPH: [0, 100], rRest: [0, 100], rCI: [0, 100],
    };
    const RANGE_LABELS = {
      rRPF: 'Restoration Priority', rRPA: 'Area percentile', rComp: 'Composition', rCH: 'Canopy height',
      rSol: 'Solar push', rSlp: 'Slope push', rWet: 'Wetland push', rPF: '% Forest', rPS: '% Shrub',
      rPH: '% Herb/Ground', rRest: '% Restorable', rCI: 'Composite Index',
    };
    const SET_LABELS = {
      selTier: 'Tier', selChk: 'Early Chinook', selFish: 'Fish access', selSrz: 'Salmon Recovery Zone',
      selMgr: 'Owner', selZon: 'Zoning', selBfw: 'Bankfull width', selHmz: 'Historic Migration Zone',
      selSal: 'Salmon', selSpecies: 'Species', selTcat: 'Temperature category', selFcat: 'Fecal category',
      selScat: 'Sediment category', selWT: 'Waterbody',
    };
    const WT_LABELS_ALL = ['Active Channel', 'Tributary', 'Lake'];
    // The all-selected, full-range filter state. The only place it is spelled out.
    function defaultFilters(labelSets) {
      return {
        selTier: new Set(labelSets.tier), selChk: new Set(labelSets.chk), selFish: new Set(labelSets.fish),
        selSrz: new Set(labelSets.srz), selMgr: new Set(labelSets.mgr), selZon: new Set(labelSets.zon),
        selBfw: new Set(labelSets.bfw), selHmz: new Set(labelSets.hmz), selSal: new Set(labelSets.sal),
        selSpecies: new Set(labelSets.species), selTcat: new Set(labelSets.tcat),
        selFcat: new Set(labelSets.fcat), selScat: new Set(labelSets.scat), selWT: new Set(WT_LABELS_ALL),
        selBufZone: new Set([0, 1, 2, 3, 4]),
        ...Object.fromEntries(Object.entries(RANGE_DEFAULTS).map(([k, v]) => [k, [...v]])),
        _labels: labelSets,
      };
    }
    // Human summary of what differs from the default. Pure; one entry per non-default filter.
    function summarizeFilters(f, labelSets) {
      if (!f || !labelSets || !labelSets.tier) return [];
      const out = [];
      const allOf = { selTier: labelSets.tier, selChk: labelSets.chk, selFish: labelSets.fish, selSrz: labelSets.srz,
        selMgr: labelSets.mgr, selZon: labelSets.zon, selBfw: labelSets.bfw, selHmz: labelSets.hmz, selSal: labelSets.sal,
        selSpecies: labelSets.species, selTcat: labelSets.tcat, selFcat: labelSets.fcat, selScat: labelSets.scat, selWT: WT_LABELS_ALL };
      const yn = { Y: 'yes', N: 'no' };
      Object.entries(allOf).forEach(([k, all]) => {
        const s = f[k]; if (!s || !all || s.size >= all.length) return;
        const vals = [...s].map(v => k === 'selSrz' ? displaySrz(v) : (k === 'selHmz' || k === 'selSal' || k === 'selChk') ? (yn[v] || v) : v);
        out.push({ key: k, label: `${SET_LABELS[k]}: ${s.size === 0 ? 'none' : vals.length > 3 ? `${vals.length} of ${all.length}` : vals.join(', ')}` });
      });
      if (f.selBufZone && f.selBufZone.size < 5) out.push({ key: 'selBufZone', label: `Buffer zones: ${f.selBufZone.size} of 5` });
      Object.entries(RANGE_DEFAULTS).forEach(([k, d]) => {
        const r = f[k]; if (!r || (r[0] === d[0] && r[1] === d[1])) return;
        out.push({ key: k, label: `${RANGE_LABELS[k]}: ${r[0]} – ${r[1]}` });
      });
      return out;
    }

    // ---------------------------------------------------------------
    // CONTRACT for every function below: `where` is SQL STRUCTURE, not data.
    // Callers pass either the literal "1" (WRIA-wide baseline) or the output of
    // buildBidQueryWhere(), which routes every user-supplied value through esc()
    // and coerces numeric ranges with unary +. Likewise `col`, `expr` and
    // `groupExpr` must be hardcoded column names or expression literals written
    // by chart code — NEVER a value read from the UI, a dropdown, or the data.
    // Interpolating user text into any of these is a SQL-injection hole that
    // will not announce itself: sql.js runs it happily and returns wrong rows.
    //
    // Join note: `bids` and `zones` share exactly two column names, `bid`
    // and `sqft`. compByZone/lcByZone join both tables, so a `where` fragment
    // that bare-references either would throw "ambiguous column name" at
    // runtime. Qualify them (b.sqft / s.sqft) if such a filter is ever added.
    //
    // compByZone note: `comp` (forest composition, -1..+1) is a FOREST-ONLY metric, but
    // 0.0 also doubles as the sentinel the zones table uses for "this zone has no forest at
    // all". Weighting it by total zone area (s.sqft) let forest-free zones vote as if
    // they were measured "perfectly mixed forest" and dragged the whole aggregate toward
    // 0 - averaged over the actual WRIA data this flips the sign of the watershed mean.
    // The aggregate below instead weights by s.lc0 * s.sqft (lc0 = Forest proportion, per
    // the landcover class layout already used by lcByZone), so a zone with zero forest area
    // contributes zero weight and drops out on its own; it also returns SUM(s.lc0 * s.sqft)
    // as forestSqft so callers (toHeat) can render "no forest in this zone" instead of a
    // fabricated 0.
    // ---------------------------------------------------------------
    // Summary Stats query layer.
    // Every function takes (db, where) where `where` is the SQL fragment from
    // buildBidQueryWhere(f). Pass "1" for the WRIA-wide baseline.
    // Exposed on window for browser-console verification.
    // ---------------------------------------------------------------
    const SQFT_PER_ACRE = 43560;
    const CI_EXPR = 'rpsf * rpsa / 100.0';

    // Memoized per-database-instance, keyed on the exact SQL string. Safe because
    // the loaded sqlite database is immutable for the life of the page (loaded once
    // from bids.sqlite, never written to) - so the same SQL string always yields the
    // same rows and can be cached forever. The WeakMap keys on `db` itself, so a
    // fresh load (e.g. a page reload) gets a fresh cache and nothing can leak across
    // database instances. Callers only ever read the returned array (they `.map()`
    // it into new objects), so handing back the cached array directly is safe too.
    const _rowsOfCache = new WeakMap();
    const rowsOf = (db, sql) => {
      let cache = _rowsOfCache.get(db);
      if (!cache) { cache = new Map(); _rowsOfCache.set(db, cache); }
      if (cache.has(sql)) return cache.get(sql);
      const r = db.exec(sql);
      const rows = r.length ? r[0].values : [];
      cache.set(sql, rows);
      return rows;
    };

    const statsKpis = (db, where) => {
      const v = rowsOf(db, `
        SELECT COUNT(*), COALESCE(SUM(sqft),0), AVG(rpsf), AVG(${CI_EXPR}), AVG(rpsa)
        FROM bids WHERE ${where}`)[0] || [0, 0, null, null, null];
      return {
        // rpf/ci/rpsa stay null (not 0) when there are no matching rows: AVG(NULL) over
        // zero rows is SQL NULL, and a zero-match selection has no mean to report - 0
        // would render as a real measurement instead of "no data".
        n: v[0], sqft: v[1], acres: v[1] / SQFT_PER_ACRE,
        rpf: v[2], ci: v[3], rpsa: v[4],
      };
    };

    const statsByExpr = (db, where, expr) => rowsOf(db, `
        SELECT ${expr} AS k, COUNT(*), COALESCE(SUM(sqft),0), AVG(rpsf), AVG(${CI_EXPR})
        FROM bids WHERE ${where} GROUP BY k ORDER BY 3 DESC`
      // NOTE: the returned row field is named `rpf` for brevity but holds AVG(rpsf),
      // the S-curve final score. Since this build surfaces rpsf everywhere under the
      // label "Final Restoration Priority", the two agree - only the internal identifier is legacy.
      ).map(([key, n, sqft, rpf, ci]) => ({
        key: (key === null || key === '') ? 'Unknown' : String(key),
        n, sqft, acres: sqft / SQFT_PER_ACRE, rpf: rpf || 0, ci: ci || 0,
      }));

    const statsByCat = (db, where, col) => statsByExpr(db, where, col);

    const statsHist = (db, where, col, min, max, bins) => {
      const w = (max - min) / bins;
      const idx = `CAST(MIN(${bins - 1}, MAX(0, (${col} - ${min}) / ${w})) AS INTEGER)`;
      const counts = new Array(bins).fill(0);
      rowsOf(db, `
        SELECT ${idx} AS b, COUNT(*) FROM bids
        WHERE ${where} AND ${col} IS NOT NULL GROUP BY b`
      ).forEach(([b, n]) => { if (b >= 0 && b < bins) counts[b] = n; });
      return counts.map((n, i) => ({ x0: min + i * w, x1: min + (i + 1) * w, n }));
    };

    // Buffer-zone gate. `zones` is a Set of zone indices 0-4 (or null for all). The channel
    // zone (z = 5) lives in the same table and must never enter a buffer-zone aggregate,
    // so the default is `s.z <= 4`, not `1`.
    const zoneClause = (zones) => (!zones || zones.size === 0 || zones.size >= 5)
      ? 's.z <= 4'
      : `s.z IN (${[...zones].map(Number).filter(n => n >= 0 && n <= 4).join(',') || '-1'})`;

    // lc0 is the Forest PROPORTION; forest area = s.lc0 * s.sqft.
    const statsCompByZone = (db, where, groupExpr, zones) => rowsOf(db, `
        SELECT ${groupExpr} AS k, s.z,
               SUM(s.comp * s.lc0 * s.sqft) / NULLIF(SUM(s.lc0 * s.sqft),0),
               SUM(s.ht   * s.sqft) / NULLIF(SUM(s.sqft),0),
               SUM(s.cht  * s.lc0 * s.sqft) / NULLIF(SUM(s.lc0 * s.sqft),0),
               SUM(s.sqft), SUM(s.lc0 * s.sqft)
        FROM zones s JOIN bids b ON b.bid = s.bid
        WHERE ${where} AND ${zoneClause(zones)} GROUP BY k, s.z ORDER BY k, s.z`
      ).map(([key, z, comp, ht, cht, sqft, forestSqft]) => ({
        key: (key === null || key === '') ? 'Unknown' : String(key),
        z, comp: comp || 0, ht: ht || 0, cht: cht || 0, sqft, forestSqft: forestSqft || 0,
      }));

    const statsLcByZone = (db, where, zones) => {
      const lcSel = Array.from({ length: 9 }, (_, i) => `SUM(s.lc${i} * s.sqft)`).join(', ');
      return rowsOf(db, `
        SELECT s.z, SUM(s.sqft), ${lcSel}
        FROM zones s JOIN bids b ON b.bid = s.bid
        WHERE ${where} AND ${zoneClause(zones)} GROUP BY s.z ORDER BY s.z`
      ).map(v => {
        const sqft = v[1] || 0;
        return { z: v[0], sqft, lc: v.slice(2).map(a => sqft ? (a || 0) / sqft : 0) };
      });
    };

    const statsSpeciesAcres = (db, where) => SALMON_SPECIES.map(sp => {
      const v = rowsOf(db, `
        SELECT COUNT(*), COALESCE(SUM(sqft),0) FROM bids
        WHERE ${where} AND sps LIKE '%${sp.replace(/'/g, "''")}%'`)[0] || [0, 0];
      return { species: sp, n: v[0], acres: v[1] / SQFT_PER_ACRE };
    });

    // Exact mean of any expression over the selection (histogram mean lines).
    const statsMean = (db, where, expr) => {
      const v = rowsOf(db, `SELECT AVG(${expr}) FROM bids WHERE ${where} AND ${expr} IS NOT NULL`)[0];
      // null, not 0, when the selection is empty: KHistogram suppresses the mean line on null,
      // whereas 0 would draw a solid "selection mean" at x=0 and read as a real measurement.
      return v && v[0] != null ? v[0] : null;
    };

    window.__stats = {
      kpis: statsKpis, byCat: statsByCat, byExpr: statsByExpr,
      hist: statsHist, compByZone: statsCompByZone, zoneClause,
      lcByZone: statsLcByZone, speciesAcres: statsSpeciesAcres,
      mean: statsMean,
      SQFT_PER_ACRE, CI_EXPR, SALMON_SPECIES,
    };

    const ZONE_LABELS = ['0–50 ft', '50–100 ft', '100–300 ft', 'HMZ', 'HMZ+300'];
    // ============================================================
    // StatsChartKit - hand-rolled SVG charts for Summary Stats.
    // One scale per chart. Selection = filled in the section hue; WRIA baseline = outline or
    // hollow dot in --ghost. Category text never wears a series colour. Every mark has a hover.
    // ============================================================
    const KW = 520, KPL = 160;   // viewBox width, category gutter
    const fmtAcres = v => v >= 1000 ? Math.round(v).toLocaleString() : v.toFixed(v < 10 ? 1 : 0);
    const fmt1 = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(1);
    const ticks = (min, max, n = 4) => Array.from({ length: n + 1 }, (_, i) => min + (max - min) * i / n);
    // Category label with wrapping/ellipsis; anchored right at x. Returns <text> + <title>.
    function CatLabel({ text, x, y, maxPx, className = 'cat' }) {
      const f = fitLabel(text, maxPx);
      const dy0 = f.lines.length === 2 ? -5.5 : 0;
      return (
        <text className={className} x={x} y={y + dy0} textAnchor="end">
          <title>{f.full}</title>
          {f.lines.map((l, i) => <tspan key={i} x={x} dy={i === 0 ? 0 : 11}>{l}</tspan>)}
        </text>
      );
    }

    // Shared empty state for KVBars/KHBars/KDumbbell: some filter combinations (e.g. a tier
    // with zero temperature-impaired reaches) legitimately have no rows to plot. Rendering
    // bare gridlines there reads as broken; say so instead.
    function KEmpty({ height = 130 }) {
      return (
        <div className="kchart" style={{ position: 'relative', display: 'flex', alignItems: 'center', justifyContent: 'center', height, color: THEME.muted, fontSize: 12 }}>
          No matching acres in this selection
        </div>
      );
    }

    function KHistogram({ sel, wria, color, meanSel, meanWria, xMin = 0, xMax = 100, fmt = v => Math.round(v), height = 170 }) {
      const { tip, show, hide } = useTip();
      const H = height, pl = 34, pb = 26, pt = 8, n = sel.length, bw = (KW - pl - 8) / n;
      const selTot = sel.reduce((a, b) => a + b.n, 0) || 1;
      const wTot = wria ? (wria.reduce((a, b) => a + b.n, 0) || 1) : 1;
      const scale = wria ? selTot / wTot : 1;
      const maxN = Math.max(1, ...sel.map(b => b.n), ...(wria ? wria.map(b => b.n * scale) : [0]));
      const y = v => pt + (H - pt - pb) * (1 - v / maxN);
      const x = v => pl + (KW - pl - 8) * (v - xMin) / (xMax - xMin);
      return (
        <div className="kchart" style={{ position: 'relative' }}>
          <svg viewBox={`0 0 ${KW} ${H}`}>
            {ticks(0, maxN).map(t => <line key={t} className="grid" x1={pl} x2={KW - 4} y1={y(t)} y2={y(t)} />)}
            {sel.map((b, i) => {
              const gx = pl + i * bw;
              const g = wria && wria[i] ? wria[i].n * scale : null;
              return (
                <g key={i} onMouseEnter={e => show(e, <><b>{fmt(b.x0)}–{fmt(b.x1)}</b><br />Selection <span className="num">{b.n.toLocaleString()}</span>{wria && <><br />WRIA (scaled) <span className="num">{Math.round(g).toLocaleString()}</span></>}</>)} onMouseLeave={hide}>
                  {g != null && <rect className="ghost" x={gx + 1} y={y(g)} width={bw - 4} height={Math.max(0, H - pb - y(g))} rx={2} />}
                  <rect className="hit" x={gx + 1} y={y(b.n)} width={bw - 4} height={Math.max(0, H - pb - y(b.n))} rx={2} fill={color} />
                </g>
              );
            })}
            {meanWria != null && <line x1={x(meanWria)} x2={x(meanWria)} y1={pt} y2={H - pb} stroke={THEME.ghost} strokeWidth={1.5} strokeDasharray="4 3" />}
            {meanSel != null && <line x1={x(meanSel)} x2={x(meanSel)} y1={pt} y2={H - pb} stroke={THEME.ink} strokeWidth={1.5} />}
            <line className="axis" x1={pl} x2={KW - 4} y1={H - pb} y2={H - pb} />
            {ticks(xMin, xMax).map(t => <text key={t} x={x(t)} y={H - pb + 13} textAnchor="middle">{fmt(t)}</text>)}
            <text x={4} y={pt + 4} textAnchor="start">reaches</text>
          </svg>
          <TipLayer tip={tip} />
        </div>
      );
    }

    function KDumbbell({ rows, color, height, attr }) {
      const { tip, show, hide } = useTip();
      if (!rows || rows.length === 0) return <KEmpty height={height} />;
      const rowH = 24, pt = 18, H = height || pt + rows.length * rowH + 22;
      const sc = v => KPL + (KW - 14 - KPL) * Math.max(0, Math.min(100, v)) / 100;
      return (
        <div className="kchart" style={{ position: 'relative' }}>
          <svg viewBox={`0 0 ${KW} ${H}`}>
            {ticks(0, 100).map(t => <g key={t}><line className="grid" x1={sc(t)} x2={sc(t)} y1={pt - 6} y2={H - 18} /><text x={sc(t)} y={H - 5} textAnchor="middle">{t}</text></g>)}
            {rows.map((r, i) => {
              const y = pt + i * rowH + rowH / 2, hasW = r.wria != null;
              const up = hasW ? r.sel >= r.wria : true;
              // Identity encoding: the filled dot is the category's own canonical colour
              // where one exists (falls back to the section hue - e.g. solar bands,
              // wetland connection, a folded "Other" row - where there is no registry
              // entry). The bar keeps the direction encoding regardless (section hue vs
              // THEME.ghost, unchanged below) - same category, two different questions.
              const dotColor = canonicalColor(attr, r.rawKey ?? r.key, color);
              return (
                <g key={r.key} onMouseEnter={e => show(e, <><b>{r.key}</b><br />Restoration Priority <span className="num">{fmt1(r.sel)}</span>{hasW && <> · WRIA <span className="num">{fmt1(r.wria)}</span></>}<br />Composite Index <span className="num">{fmt1(r.ci)}</span>{hasW && <> · WRIA <span className="num">{fmt1(r.wci)}</span></>}{r.n != null && <><br /><span className="num">{r.n.toLocaleString()}</span> reaches</>}</>)} onMouseLeave={hide}>
                  <CatLabel text={r.key} x={KPL - 10} y={y + 4} maxPx={KPL - 16} />
                  {hasW && <line x1={sc(r.wria)} x2={sc(r.sel)} y1={y} y2={y} stroke={up ? color : THEME.ghost} strokeWidth={4} strokeLinecap="round" opacity={0.55} />}
                  {hasW && <circle cx={sc(r.wria)} cy={y} r={5} fill="#fff" stroke={THEME.ghost} strokeWidth={1.75} />}
                  <circle className="hit" cx={sc(r.sel)} cy={y} r={5.5} fill={dotColor} stroke="#fff" strokeWidth={1.5} />
                  {(() => {
                    const lx = sc(Math.max(r.sel, hasW ? r.wria : 0));
                    const clip = lx > KW - 45;
                    return <text className="lab" x={clip ? lx - 10 : lx + 10} y={y + 3.5} textAnchor={clip ? 'end' : undefined}>{fmt1(r.sel)}</text>;
                  })()}
                </g>
              );
            })}
            <text x={KW - 14} y={pt - 10} textAnchor="end">mean Restoration Priority</text>
          </svg>
          <TipLayer tip={tip} />
        </div>
      );
    }

    // 'noforest' cells (a zone that's present but has zero forest area) render in this
    // light warm grey, deliberately outside the conifer<->deciduous ramp AND distinct from
    // THEME.line2 ("no data" - zone absent from the result set entirely), so the two
    // absences read as different things rather than both looking like pale ramp values.
    const NOFOREST_FILL = '#E4E1DB', NOFOREST_STROKE = '#D5D1C9';
    function KHeatmap({ rows, cols, mode = 'div', fmt = v => v.toFixed(2) }) {
      const { tip, show, hide } = useTip();
      const showKey = mode === 'seq';
      const rowH = 22, pt = 20, H = pt + rows.length * rowH + 8, cw = (KW - KPL - 6) / cols.length;
      // Sequential ramp: normalise against the actual min/max of this chart's cells (values
      // here are raw units - e.g. feet - not already 0-1), so the ramp actually varies.
      const seqVals = showKey ? rows.flatMap(r => r.cells).filter(v => typeof v === 'number') : [];
      const seqLo = seqVals.length ? Math.min(...seqVals) : 0;
      const seqHi = seqVals.length ? Math.max(...seqVals) : 1;
      const seq = v => (seqHi === seqLo)
        ? lerpHex(THEME.accentTint, THEME.accentInk, 0.5)
        : lerpHex(THEME.accentTint, THEME.accentInk, Math.max(0, Math.min(1, (v - seqLo) / (seqHi - seqLo))));
      const col = v => v == null ? THEME.line2 : v === 'noforest' ? NOFOREST_FILL : mode === 'div' ? compColor(v) : seq(v);
      return (
        <div className="kchart" style={{ position: 'relative' }}>
          <svg viewBox={`0 0 ${KW} ${H}`}>
            {cols.map((c, j) => <text key={c} className="cat" x={KPL + j * cw + cw / 2} y={13} textAnchor="middle">{c}</text>)}
            {rows.map((r, i) => {
              const y = pt + i * rowH;
              return (
                <g key={r.key}>
                  <CatLabel text={r.key} x={KPL - 8} y={y + 15} maxPx={KPL - 14} className={r.baseline ? 'cat baseline' : 'cat'} />
                  {r.baseline && <line x1={KPL} x2={KW - 4} y1={y - 1} y2={y - 1} stroke={THEME.ghost} strokeDasharray="3 3" />}
                  {cols.map((c, j) => (
                    <rect key={c} className="hit" x={KPL + j * cw + 1} y={y + 1} width={cw - 2} height={rowH - 2} rx={2}
                      fill={col(r.cells[j])}
                      stroke={r.cells[j] === 'noforest' ? NOFOREST_STROKE : 'none'}
                      strokeWidth={r.cells[j] === 'noforest' ? 1 : 0}
                      onMouseEnter={e => show(e, <><b>{r.key}</b> · {c}<br />{r.cells[j] == null ? 'no area in zone' : r.cells[j] === 'noforest' ? 'no forest in this zone' : <span className="num">{fmt(r.cells[j])}</span>}</>)} onMouseLeave={hide} />
                  ))}
                </g>
              );
            })}
          </svg>
          {showKey && seqVals.length > 0 && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 11, color: THEME.muted, marginTop: 2, paddingLeft: KPL }}>
              <span className="num">{fmt(seqLo)}</span>
              <span style={{ flex: 1, height: 8, borderRadius: 3, background: `linear-gradient(to right, ${THEME.accentTint}, ${THEME.accentInk})` }} />
              <span className="num">{fmt(seqHi)}</span>
            </div>
          )}
          {(mode === 'div' || mode === 'seq') && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 11, color: THEME.muted, marginTop: 4, paddingLeft: KPL, flexWrap: 'wrap' }}>
              {mode === 'div' && <>
                <span>Conifer</span>
                <span style={{ width: 54, height: 8, borderRadius: 3, background: `linear-gradient(to right, ${COMP_POLES.conifer}, ${COMP_POLES.mid}, ${COMP_POLES.deciduous})` }} />
                <span>Deciduous</span>
              </>}
              <LegendRow items={[
                { label: 'No forest', color: NOFOREST_FILL },
                { label: 'No data', color: THEME.line2 },
              ]} />
            </div>
          )}
          <TipLayer tip={tip} />
        </div>
      );
    }

    function KHBars({ rows, color, unit = '%', max }) {
      const { tip, show, hide } = useTip();
      if (!rows || rows.length === 0) return <KEmpty />;
      const rowH = 22, pt = 14, H = pt + rows.length * rowH + 22;

          <TipLayer tip={tip} />

    function KRateTiles({ tiles, hue }) {

    function KRose({ rows, color, flat }) {
      const { tip, show, hide } = useTip();
      const H = 230, cx = KW / 2, cy = 116, R = 92;
      const mx = Math.max(1, ...rows.map(r => Math.max(r.sel, r.wria || 0)));
      const rr = v => R * v / mx;
      const arc = (r, a0, a1) => { const p = (rad, a) => [cx + rad * Math.sin(a), cy - rad * Math.cos(a)]; const [x0, y0] = p(r, a0), [x1, y1] = p(r, a1); return `M${cx} ${cy}L${x0} ${y0}A${r} ${r} 0 0 1 ${x1} ${y1}Z`; };
      return (

            {rows.map((r, i) => {

              return (
                <g key={r.key} onMouseEnter={e => show(e, <><b>{r.key}</b><br />Selection <span className="num">{fmt1(r.sel)}%</span>{r.wria != null && <> · WRIA <span className="num">{fmt1(r.wria)}%</span></>}</>)} onMouseLeave={hide}>
                  {r.wria > 0 && <path d={arc(rr(r.wria), a0, a1)} fill="none" stroke={THEME.ghost} strokeWidth={1.25} />}
                  {r.sel > 0 && <path className="hit" d={arc(rr(r.sel), a0, a1)} fill={color} fillOpacity={0.9} />}
                  <text className="cat" x={cx + (R + 14) * Math.sin(la)} y={cy - (R + 14) * Math.cos(la) + 4} textAnchor="middle">{r.key}</text>

            <text x={KW - 8} y={H - 8} textAnchor="end">Flat/unknown: {fmt1(flat)}% (not plotted)</text>

    function KLcStack({ rows }) {

              <pattern id="lcCimp" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill={LC9[LC_CIMP_IDX].color} /><circle cx="2" cy="2" r=".9" fill="rgba(38,73,20,.75)" /></pattern>
            </defs>

            {rows.map((r, i) => {

                      onMouseEnter={e => show(e, <><b>{LC_LABELS_9[k]}</b> · {r.zone}<br /><span className="num">{(s * 100).toFixed(1)}%</span> of zone area</>)} onMouseLeave={hide} /> : null;
                  })}

          <TipLayer tip={tip} />
