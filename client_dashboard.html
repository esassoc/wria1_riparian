<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WRIA 1 Riparian Restoration Prioritization</title>
  <!--
    WRIA 1 Riparian Restoration Prioritization
    Deep link to a single bank: append #bid/<BID_ID> to this page's URL.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          ground:'#F4F5F2', surface:'#FFFFFF', surface2:'#F9FAF8',
          ink:'#163A4A', ink2:'#3F5560', muted:'#7E8F96', faint:'#B9C4C8',
          line:'#DDE2E0', line2:'#EBEEEC',
          accent:'#0F8B9F', accentInk:'#0B6E7E', accentTint:'#E3F1F4', accentTint2:'#C9E5EA',
          attn:'#D2623A', attnTint:'#FBE9E2', ghost:'#9AA6AB',
        },
        fontFamily: {
          h: ['Archivo','Arial','sans-serif'],
          b: ['"IBM Plex Sans"','Arial','sans-serif'],
          m: ['"IBM Plex Mono"','Consolas','monospace'],
        },
      }}
    };
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/prop-types@15/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --ground:#F4F5F2; --surface:#FFFFFF; --surface-2:#F9FAF8;
      --ink:#163A4A; --ink-2:#3F5560; --muted:#7E8F96; --faint:#B9C4C8;
      --line:#DDE2E0; --line-2:#EBEEEC;
      --accent:#0F8B9F; --accent-ink:#0B6E7E; --accent-tint:#E3F1F4; --accent-tint-2:#C9E5EA;
      --attn:#D2623A; --attn-tint:#FBE9E2; --ghost:#9AA6AB;
      --s-rest:#0F8B9F; --s-rest-t:#E3F1F4; --s-fish:#DA6B49; --s-fish-t:#FBEBE4;
      --s-imp:#9E3B3B; --s-imp-t:#F6E7E7; --s-riv:#3E6FB0; --s-riv-t:#E7EEF8;
      --s-adm:#8A6538; --s-adm-t:#F3ECE3; --s-mod:#B98515; --s-mod-t:#F8F1DF;
      --lc-rail:#7B6486; --lc-cimp:#6C8C6C;
      --font-h:'Archivo',Arial,sans-serif; --font-b:'IBM Plex Sans',Arial,sans-serif; --font-m:'IBM Plex Mono',Consolas,monospace;
    }
    body{font-family:var(--font-b);color:var(--ink);background:var(--ground)}
    h1,h2,h3,h4{font-family:var(--font-h);color:var(--ink)}
    .num{font-family:var(--font-m);font-variant-numeric:tabular-nums}
    .eyebrow{font-family:var(--font-h);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    /* card */
    .card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
    .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
    .card-h h3,.card-h h4{font-size:13px;font-weight:600;margin:0}
    .card-b{padding:12px 14px}
    /* buttons */
    .btn{appearance:none;font:500 13px var(--font-b);border-radius:5px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2}
    .btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .btn:hover{border-color:var(--faint);color:var(--ink)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff}
    .btn.attn{background:var(--attn);border-color:var(--attn);color:#fff;box-shadow:0 0 0 3px var(--attn-tint)}
    .btn.ghost{border-color:transparent;background:transparent}
    .btn.sm{font-size:11.5px;padding:3px 8px}
    .btn:disabled{opacity:.4;cursor:default}
    .btn:focus-visible,.chip:focus-visible,.term:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    /* chips, badges, pills */
    .chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--font-b);padding:3px 9px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);line-height:1.3;cursor:pointer}
    .chip .dot{width:9px;height:9px;border-radius:2px;background:var(--c,var(--faint));flex:none}
    .chip.on{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
    .chip.on.lt{color:var(--ink)}
    .chip.off{opacity:.55}
    .chip.sel{background:var(--accent-tint);border-color:var(--accent-tint-2);color:var(--accent-ink);cursor:default}
    .chip.sel .x{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--muted);margin-left:2px;cursor:pointer}
    .chip.static{cursor:default}
    .badge{font:500 10px var(--font-m);background:var(--accent-tint);color:var(--accent-ink);border-radius:9px;padding:1px 7px}
    .pill{display:inline-block;font:500 11px var(--font-m);color:#fff;background:var(--c);border-radius:3px;padding:1px 6px;line-height:1.4}
    .pill.lt{color:var(--ink)}
    .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-2)}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .legend i{width:10px;height:10px;border-radius:2px;background-color:var(--c);display:inline-block}
    .legend i.hollow{background:none;border:1.5px solid var(--ghost)}
    .legend i.dash{width:14px;height:0;border-top:2px dashed var(--ghost);border-radius:0}
    .legend i.solid{width:14px;height:0;border-top:2px solid var(--ink);border-radius:0}
    .note{font-size:12px;color:var(--ink-2);background:var(--accent-tint);border:1px solid var(--accent-tint-2);border-radius:5px;padding:8px 12px}
    .seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
    .seg button{appearance:none;border:0;background:var(--surface);font:500 12px var(--font-b);color:var(--ink-2);padding:4px 10px;cursor:pointer}
    .seg button+button{border-left:1px solid var(--line)}
    .seg button.on{background:var(--accent-tint);color:var(--accent-ink)}
    /* explanatory hover */
    .term{border-bottom:1px dotted var(--faint);cursor:help;position:relative}
    .term-pop{z-index:60;width:max-content;max-width:280px;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:8px 10px;font:400 12px/1.4 var(--font-b);color:var(--ink-2);box-shadow:0 4px 14px rgba(22,58,74,.12);text-transform:none;letter-spacing:0;white-space:normal}
    /* chart tooltip */
    .tip{position:absolute;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:6px 9px;font:400 11.5px/1.4 var(--font-b);color:var(--ink-2);box-shadow:0 4px 14px rgba(22,58,74,.12);white-space:nowrap}
    .tip b{color:var(--ink);font-weight:600}
    .tip .num{color:var(--ink)}
    /* landcover textures */
    .tx-rail{background-color:var(--lc-rail)!important;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.38) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 1px,transparent 1px 4px)}
    .tx-cimp{background-color:var(--lc-cimp)!important;background-image:radial-gradient(rgba(38,73,20,.75) .9px,transparent 1.1px);background-size:4px 4px;background-position:1px 1px}
    /* section (Summary Stats) */
    .sec{margin-top:14px;border-left:4px solid var(--c);overflow:hidden}
    .sec>.sh{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface);cursor:pointer;user-select:none;width:100%;border:0;text-align:left}
    .sec>.sh .ic{width:26px;height:26px;border-radius:6px;background:var(--ct);display:grid;place-items:center;color:var(--c);flex:none}
    .sec>.sh .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
    .sec>.sh h3{font-size:14px;font-weight:600;margin:0}
    .sec>.sh .sub{font-size:12px;color:var(--muted)}
    .sec>.sh .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
    .sec.open>.sh .chev{transform:rotate(90deg)}
    .sec>.sb{padding:6px 16px 18px;border-top:1px solid var(--line-2)}
    /* filter group (BID Query rail) */
    .fgroup{border-top:1px solid var(--line-2)}
    .fgroup>button{appearance:none;width:100%;text-align:left;border:0;background:none;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;font:600 12px var(--font-h);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
    .fgroup>button .stripe{width:3px;height:16px;border-radius:2px;background:var(--c)}
    .fgroup>button .chev{margin-left:auto;color:var(--muted);transition:transform .15s}
    .fgroup.open>button .chev{transform:rotate(90deg)}
    .fgroup .fb{padding:2px 14px 12px}
    .fl{font-size:11.5px;color:var(--ink-2);font-weight:500;display:flex;justify-content:space-between;align-items:baseline;margin:8px 0 5px}
    .fl .num{color:var(--muted);font-weight:400}
    .fl button{appearance:none;border:0;background:none;font:500 11px var(--font-b);color:var(--accent-ink);cursor:pointer;padding:0}
    /* dual range slider */
    .drs{position:relative;height:18px;margin:2px 0 4px}
    .drs .track{position:absolute;left:0;right:0;top:8px;height:3px;background:var(--line);border-radius:2px}
    .drs .range{position:absolute;top:8px;height:3px;background:var(--accent);border-radius:2px}
    .drs input[type="range"]{-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;position:absolute;width:100%;height:20px;margin:0;padding:0;top:-1px;z-index:2}
    .drs input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:all;cursor:pointer;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 2px rgba(22,58,74,.25);margin-top:-5px}
    .drs input[type="range"]::-moz-range-thumb{pointer-events:all;cursor:pointer;width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--accent);box-shadow:0 1px 2px rgba(22,58,74,.25)}
    .drs input[type="range"]::-webkit-slider-runnable-track{height:4px;background:transparent}
    .drs input[type="range"]::-moz-range-track{height:4px;background:transparent;border:none}
    /* tables */
    table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
    table.tbl th{font:600 11px var(--font-h);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
    table.tbl th.n,table.tbl td.n{text-align:right;font-family:var(--font-m);font-variant-numeric:tabular-nums}
    table.tbl th.sorted{color:var(--accent-ink);border-bottom-color:var(--accent)}
    table.tbl td{padding:7px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap;color:var(--ink-2)}
    table.tbl tr.dim td{color:var(--faint)}
    table.tbl tr.tot td{border-top:1px solid var(--line);font-weight:600;color:var(--ink)}
    table.tbl tbody tr:hover td{background:var(--surface-2)}
    table.tbl.compact th{padding:6px 8px;font-size:10.5px}
    table.tbl.compact td{padding:6px 8px;font-size:12px}
    /* KPI + rate tiles */
    .kpi{padding:10px 14px 12px}
    .kpi .k{font-size:11.5px;color:var(--muted);font-weight:500}
    .kpi .v{font:600 26px/1.1 var(--font-h);color:var(--ink);margin-top:4px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
    .kpi .w{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--muted)}
    .delta{font:500 11px var(--font-m);padding:1px 6px;border-radius:3px;background:var(--accent-tint);color:var(--accent-ink)}
    .delta.dn{background:var(--attn-tint);color:#9A4526}
    .delta.eq{background:var(--line-2);color:var(--muted)}
    .rtile{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:var(--surface-2)}
    .rtile .k{font-size:11.5px;color:var(--muted);font-weight:500}
    .rtile .v{font:600 22px/1.1 var(--font-h);color:var(--c);margin-top:3px;font-variant-numeric:tabular-nums}
    .rtile .v small{font:400 12px var(--font-b);color:var(--muted)}
    .rtile .w{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
    /* chart cell text */
    .kchart svg{display:block;width:100%;height:auto}
    .kchart svg text{font-family:var(--font-m);font-size:9.5px;fill:var(--muted)}
    .kchart svg .cat{font-family:var(--font-b);font-size:10.5px;fill:var(--ink-2)}
    .kchart svg .lab{font-family:var(--font-m);font-size:9.5px;fill:var(--ink-2);font-weight:500}
    .kchart svg .grid{stroke:var(--line-2)}
    .kchart svg .axis{stroke:var(--line)}
    .kchart svg .ghost{fill:none;stroke:var(--ghost);stroke-width:1.25}
    .kchart svg .hit:hover{filter:brightness(.92)}

    /* BID Query rail layout (Task 6) */
    .bq{display:grid;grid-template-columns:352px minmax(0,1fr);gap:18px;align-items:start}
    /* minmax(0,1fr), not a bare 1fr: a plain fr track's automatic minimum is its content's
       min-content size, so the wide map/table would blow the single column out past the
       viewport instead of shrinking into it (their own overflow-x:auto never gets a chance
       to engage because the grid track never gets narrow enough to trigger it). */
    @media (max-width:1100px){.bq{grid-template-columns:minmax(0,1fr)}}
    .rail{position:sticky;top:12px;display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
    @media (max-width:1100px){.rail{position:static;max-height:none}}
    .rail .scroll{overflow:auto;padding:0 0 4px}
    .rail .act{border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 6px 6px}
    .rail .act .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
    .rail .act .cnt b{color:var(--ink);font-weight:600}
    .applied{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2)}
    .applied .lab{font-size:11px;color:var(--muted);margin-right:2px}
    .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
    .chips{display:flex;flex-wrap:wrap;gap:5px}
    .be{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:18px} /* minmax(0,1fr), NOT a bare 1fr: a bare fr track will not shrink below its content's
       min-content width. The zone grid inside is ~772px intrinsic, so a bare 1fr pushed the
       whole page to 822px at a 768px viewport. Same defect that was fixed on .bq in Task 6. */
    @media (max-width:1000px){.be{grid-template-columns:minmax(0,1fr)}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const {
      BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, Legend,
      PieChart, Pie, Cell, ResponsiveContainer, ReferenceLine,
      ComposedChart, Area, AreaChart, Line, LineChart,
      RadarChart, Radar, PolarGrid, PolarAngleAxis, PolarRadiusAxis,
      ScatterChart, Scatter, ZAxis, Treemap, LabelList
    } = Recharts;

    // ============================================================
    // Design system - tokens, canonical category colours, labels, hovers, primitives
    // ============================================================
    const THEME = {
      ground:'#F4F5F2', surface:'#FFFFFF', surface2:'#F9FAF8',
      ink:'#163A4A', ink2:'#3F5560', muted:'#7E8F96', faint:'#B9C4C8',
      line:'#DDE2E0', line2:'#EBEEEC',
      accent:'#0F8B9F', accentInk:'#0B6E7E', accentTint:'#E3F1F4', accentTint2:'#C9E5EA',
      attn:'#D2623A', attnTint:'#FBE9E2', ghost:'#9AA6AB',
      sections: {
        rest: { hue:'#0F8B9F', tint:'#E3F1F4' },
        fish: { hue:'#DA6B49', tint:'#FBEBE4' },
        imp:  { hue:'#9E3B3B', tint:'#F6E7E7' },
        riv:  { hue:'#3E6FB0', tint:'#E7EEF8' },
        adm:  { hue:'#8A6538', tint:'#F3ECE3' },
        mod:  { hue:'#B98515', tint:'#F8F1DF' },
      },
    };
    const lerpHex = (a, b, t) => {
      const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
      const A = p(a), B = p(b);
      return '#' + A.map((c, i) => Math.round(c + (B[i] - c) * t).toString(16).padStart(2, '0')).join('');
    };

    // One landcover set for the whole app (Bank Explorer grid, Scoring Lab grid, Summary Stats
    // stack, every legend). Index = landcover class index used by zone arrays and the zones table.
    const LC9 = [
      { key: 'Forest',                   color: '#264914' },
      { key: 'Shrub/Woodland',           color: '#C6A871' },
      { key: 'Shrub',                    color: '#F3CF8B' },
      { key: 'Ground/Herbaceous',        color: '#F5F57A' },
      { key: 'Impervious',               color: '#4A5057' },
      { key: 'Canopy over Impervious',   color: '#6C8C6C', texture: 'tx-cimp' },
      { key: 'Water',                    color: '#6E9ECF' },
      { key: 'Gravel/Abandoned Channel', color: '#A6C8E0' },
      { key: 'Railway',                  color: '#7B6486', texture: 'tx-rail' },
    ];
    const LC_LABELS_9 = LC9.map(l => l.key);
    const LC_COLORS_9 = LC9.map(l => l.color);
    const LC_COLORS = Object.fromEntries(LC9.map(l => [l.key, l.color]));
    // Which LC9 indices carry a texture (and their colours), derived from the registry so
    // KLcStack's <pattern> defs can't drift from LC9 if a class or texture is ever reordered.
    const LC_RAIL_IDX = LC9.findIndex(l => l.texture === 'tx-rail');
    const LC_CIMP_IDX = LC9.findIndex(l => l.texture === 'tx-cimp');
    const lcTextureClass = i => (LC9[i] && LC9[i].texture) || '';

    // Composition ramp. POSITIVE = CONIFER in this codebase. The Forest colour is the midpoint,
    // so mixed forest reads as "forest"; tints lean teal (conifer) or brick (deciduous) and the
    // path never passes through yellow, gray or any other landcover colour.
    const COMP_POLES = { conifer: '#2A8F72', mid: '#264914', deciduous: '#B03A2E' };
    function compColor(v) {
      if (v == null || isNaN(v)) return COMP_POLES.mid;
      const a = Math.min(1, Math.abs(v));
      const t = a < 0.1 ? a * 2 : 0.2 + 0.8 * (a - 0.1) / 0.9;   // |v| < 0.1 is "Mixed"
      return lerpHex(COMP_POLES.mid, v > 0 ? COMP_POLES.conifer : COMP_POLES.deciduous, t);
    }

    // Canonical category colours. Colour follows the entity, never its rank or position.
    const TIER_COLORS = { P1: '#8E2440', P2: '#D2623A', P3: '#DDAA3E', P4: '#2F6FA8', P5: '#8E9AA1' };
    const TIER_LIGHT = new Set(['P3', 'P5']);       // ink text on these
    const TIER_LABELS = {
      P1: 'P1: Spring Chinook habitat in the Nooksack that is also 303(d) temperature-listed',
      P2: 'P2: Spring Chinook habitat in the Nooksack without temperature listing, or other fish-bearing water that is temperature-listed',
      P3: 'P3: Fish-bearing in the Nooksack without Spring Chinook or temperature listing, or fish-bearing elsewhere in WRIA 1 that is temperature-listed',
      P4: 'P4: Fish-bearing outside the Nooksack, not temperature-listed',
      P5: 'P5: No fish access - capped here by access, not by riparian condition',
    };
    const SR_ZONE_COLORS = {
      'Lower Mainstem Nooksack': '#163A4A', 'Upper Mainstem Nooksack': '#2B5A78',
      'Lower NF Nooksack': '#3E6FB0',        'Upper NF Nooksack': '#6F97CC',
      'Lower MF Nooksack': '#0F8B9F',        'Upper MF Nooksack': '#7CC1CB',
      'Lower SF Nooksack': '#2A8F72',        'Upper SF Nooksack': '#8FC3AE',
      'Frontal/Coastal multiple': '#B98515', 'Fraser River Tributaries': '#8A6538',
      'Lake Whatcom': '#7B6486',             'Unknown': '#B9C4C8',
    };
    const MANAGER_CAT_COLORS = {
      'Federal': '#38A800', 'State': '#0070FF', 'Tribal': '#A87000',
      'Local': '#FFAA00', 'NGO': '#7A00E6', 'Private/Unknown': '#B2B2B2',
    };
    const ZONING_COLORS = {
      'Commercial Forest': '#267300', 'Rural Forest': '#4DA84D',
      'Agriculture': '#E8D74D', 'Rural Residential': '#FFAA00',
      'Urban/UGA': '#E60000',
      'Federal Forest': '#8400A8', 'Public/Open Space': '#B0D1A8',
      'Industrial': '#9C1FB0', 'Unknown': '#B2B2B2',
    };
    const BFW_COLORS = {
      'Headwater/Ditch': '#A9C9E6', 'Small Stream': '#6F97CC',
      'Medium Stream': '#3E6FB0', 'Large Stream': '#2B5A78', 'Mainstem': '#163A4A',
    };

      const openPop = () => {
        const el = ref.current;
        if (el) {
          const r = el.getBoundingClientRect();
          // Popovers default to opening above the trigger; if there isn't room
          // (near the top of a scroll container or the viewport), open below instead.
          // Positioned via getBoundingClientRect + a document.body portal (below) so
          // no ancestor's overflow:auto (table wrapper, .rail .scroll) can clip it.
          if (r.top > 120) setPos({ left: r.left, bottom: window.innerHeight - r.top + 6 });
          else setPos({ left: r.left, top: r.bottom + 6 });
        }
        setOpen(true);
      };
      const closePop = () => setOpen(false);

        <span className="term" ref={ref} tabIndex={0}

      return { tip, show, hide };

    function fitLabel(text, maxPx, fontPx = 10.5) {
      const cw = fontPx * 0.55, maxCh = Math.max(4, Math.floor(maxPx / cw));
      const s = String(text);
      if (s.length <= maxCh) return { lines: [s], full: s, truncated: false };
      const words = s.split(' ');
      let l1 = '', i = 0;
      while (i < words.length && (l1 + (l1 ? ' ' : '') + words[i]).length <= maxCh) { l1 += (l1 ? ' ' : '') + words[i]; i++; }
      if (!l1) { l1 = s.slice(0, maxCh); i = words.length; }
      let l2 = words.slice(i).join(' ');
      const truncated = l2.length > maxCh;
      if (truncated) l2 = l2.slice(0, maxCh - 1) + '…';

        { type: 'gravel_bar', zone: 0, col: 3, row: 12, w: 4, h: 3 },
      ],
      patchy_woodland: [
        { type: 'pond', zone: 0, col: 0, row: 6, w: 3, h: 3 },
        { type: 'road', row: 10, startZone: 3, endZone: 4 },
      ],
      clearcut_recovery: [
        { type: 'road', row: 8, startZone: 1, endZone: 4 },
        { type: 'gravel_bar', zone: 0, col: 2, row: 13, w: 5, h: 2 },
      ],
      ag_floodplain: [
        { type: 'gravel_bar', zone: 0, col: 0, row: 10, w: 7, h: 4 },
        { type: 'road', row: 5, startZone: 2, endZone: 4 },
      ],
      suburban_edge: [
        { type: 'road', row: 8, startZone: 2, endZone: 4 },
        { type: 'bldg', zone: 3, col: 2, row: 3, w: 3, h: 2 },
        { type: 'bldg', zone: 3, col: 7, row: 11, w: 2, h: 2 },
        { type: 'bldg', zone: 4, col: 1, row: 2, w: 3, h: 2 },
        { type: 'bldg', zone: 4, col: 5, row: 12, w: 3, h: 2 },
        { type: 'canopy_imp', zone: 2, col: 5, row: 3, w: 4, h: 3 },
      ],
      urban_hardscape: [
        { type: 'road', row: 5, startZone: 1, endZone: 4 },
        { type: 'road', row: 12, startZone: 2, endZone: 4 },
        { type: 'rail', row: 15, startZone: 3, endZone: 4 },
        { type: 'bldg', zone: 2, col: 2, row: 7, w: 5, h: 3 },
        { type: 'bldg', zone: 3, col: 1, row: 1, w: 4, h: 3 },
        { type: 'bldg', zone: 3, col: 1, row: 7, w: 4, h: 3 },
        { type: 'bldg', zone: 4, col: 1, row: 1, w: 5, h: 3 },
        { type: 'bldg', zone: 4, col: 1, row: 7, w: 5, h: 3 },
        { type: 'canopy_imp', zone: 1, col: 2, row: 1, w: 3, h: 3 },
      ],
    };
    function applyFeature(zones, feat, seed, zoneData) {
      const { type } = feat;
      if (type === 'road' || type === 'rail') {
        const lcIdx = type === 'rail' ? 8 : 4;
        for (let zi = (feat.startZone || 0); zi <= (feat.endZone || 4); zi++) {
          const cols = GRID_ZONE_COLS[zi];
          if (feat.row >= GRID_ROWS) continue;
          for (let c = 0; c < cols; c++) {
            zones[zi][feat.row * cols + c] = { lc: lcIdx, bri: 0.92 + lcHash(c, feat.row, seed + 44444) * 0.08, comp: 0 };
          }
        }
      } else if (type === 'pond') {
        const { zone: zi, col: fc, row: fr, w, h } = feat;
        const cols = GRID_ZONE_COLS[zi];
        const cx = fc + w / 2, cy = fr + h / 2;
        for (let r = fr; r < Math.min(fr + h, GRID_ROWS); r++) {
          for (let c = fc; c < Math.min(fc + w, cols); c++) {
            const dx = (c - cx) / (w / 2), dy = (r - cy) / (h / 2);
            if (dx * dx + dy * dy < 1.0 + lcHash(c, r, seed + 33333) * 0.3) {
              zones[zi][r * cols + c] = { lc: 6, bri: 0.85 + lcHash(c, r, seed + 22222) * 0.15, comp: 0 };
            }
          }
        }
      } else if (type === 'bldg') {
        const { zone: zi, col: fc, row: fr, w, h } = feat;
        const cols = GRID_ZONE_COLS[zi];
        for (let r = fr; r < Math.min(fr + h, GRID_ROWS); r++) {
          for (let c = fc; c < Math.min(fc + w, cols); c++) {
            zones[zi][r * cols + c] = { lc: 4, bri: 0.90 + lcHash(c, r, seed + 11111) * 0.1, comp: 0 };
          }
        }
      } else if (type === 'gravel_bar') {
        const { zone: zi, col: fc, row: fr, w, h } = feat;
        const cols = GRID_ZONE_COLS[zi];
        for (let r = fr; r < Math.min(fr + h, GRID_ROWS); r++) {
          for (let c = fc; c < Math.min(fc + w, cols); c++) {
            if (lcHash(c, r, seed + 55555) < 0.85) {
              zones[zi][r * cols + c] = { lc: 7, bri: 0.85 + lcHash(c, r, seed + 66666) * 0.2, comp: 0 };
            }
          }
        }
      } else if (type === 'stand') {
        const { zone: zi, col: fc, row: fr, w, h, comp: sComp } = feat;
        const cols = GRID_ZONE_COLS[zi];
        for (let r = fr; r < Math.min(fr + h, GRID_ROWS); r++) {
          for (let c = fc; c < Math.min(fc + w, cols); c++) {
            const cv = sComp + (lcHash(c, r, seed + 77777) - 0.5) * 0.15;
            zones[zi][r * cols + c] = {
              lc: 0,
              bri: 0.85 + lcHash(c + 3, r + 7, seed + 88888) * 0.2,
              comp: Math.max(-1, Math.min(1, cv)),
              height: Math.max(5, Math.round(zoneData[zi][9] + (lcHash(c + 5, r + 3, seed + 45678) - 0.5) * 20)),
              density: Math.max(0, Math.min(1, zoneData[zi][11] + (lcHash(c + 7, r + 11, seed + 56789) - 0.5) * 0.1))
            };
          }
        }
      } else if (type === 'canopy_imp') {
        const { zone: zi, col: fc, row: fr, w, h } = feat;
        const cols = GRID_ZONE_COLS[zi];
        for (let r = fr; r < Math.min(fr + h, GRID_ROWS); r++) {
          for (let c = fc; c < Math.min(fc + w, cols); c++) {
            zones[zi][r * cols + c] = { lc: 5, bri: 0.88 + lcHash(c, r, seed + 99999) * 0.15, comp: 0 };
          }
        }
      }
    }
    // Composition colour for a grid cell. Delegates to the app-wide ramp (positive = conifer).
    const compToColor = compColor;
    const LAB_ZONE_LABELS = ['0–50 ft','50–100 ft','100–300 ft','HMZ','HMZ+300'];
    const LAB_DECAY = [10,6,3,2,1];
    // True watershed means of the S-track pushes (sols/slps in bids.sqlite), measured via
    // AVG(sols) and AVG(slps): solar 2.77, slope 1.04. These were previously the range
    // midpoints (half of MAX_SOLAR_PUSH 12 / MAX_SLOPE_PUSH 5 = 6 / 2.5) mislabelled as
    // averages; the project lead approved switching to the true means since this panel
    // teaches how scoring works and a doubled number teaches the wrong intuition.
    const LAB_SOLAR = 2.77, LAB_SLOPE = 1.04;

    // --- Spatial noise for realistic landcover grids ---
    // Integer hash → 0-1
    function lcHash(ix, iy, s) {
      let h = (ix * 374761393 + iy * 668265263 + s * 1274126177) | 0;
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }
    // Smooth 2D value noise (bilinear interpolation with smoothstep)
    function sNoise(x, y, s) {
      const ix = Math.floor(x), iy = Math.floor(y);
      const fx = x - ix, fy = y - iy;
      const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
      return lcHash(ix,iy,s)*(1-sx)*(1-sy) + lcHash(ix+1,iy,s)*sx*(1-sy)
           + lcHash(ix,iy+1,s)*(1-sx)*sy   + lcHash(ix+1,iy+1,s)*sx*sy;
    }
    // Multi-octave fractal noise with per-cell speckle
    function fNoise(x, y, s) {
      return sNoise(x, y, s) * 0.35                       // large patches / stands
           + sNoise(x * 2.2, y * 2.2, s + 5000) * 0.25   // medium clusters
           + sNoise(x * 5, y * 5, s + 9000) * 0.22        // small clumps (3-4 cells)
           + lcHash(Math.floor(x*5.5)|0, Math.floor(y*5.5)|0, s+13000) * 0.18; // per-cell speckle
    }

    // Column counts per zone  [50ft, 100ft, 300ft, HMZ, HMZ+300]
    const GRID_ZONE_COLS = [8, 7, 15, 10, 10];
    const GRID_TOTAL_COLS = 50;
    const GRID_ROWS = 16;

    // Build a 2D landcover grid with natural patchy/speckled patterns
    function buildLCGrid(zoneData, scenIdx) {
      const seed = scenIdx * 7919 + 31;
      // Precompute column-to-zone mapping
      const colZone = [];
      GRID_ZONE_COLS.forEach((n, zi) => { for (let i = 0; i < n; i++) colZone.push(zi); });

      // For zone boundaries: blend probabilities across a 2-col transition strip
      const zones = [];
      let colOff = 0;
      for (let zi = 0; zi < 5; zi++) {
        const cols = GRID_ZONE_COLS[zi];
        const cells = [];
        for (let r = 0; r < GRID_ROWS; r++) {
          for (let c = 0; c < cols; c++) {
            const gc = colOff + c; // global column
            const probs = zoneData[zi].slice(0, LAB_LC_COUNT);
            // Gravel/Abandoned Channel only occurs in zone 0 (0-50ft); elsewhere → impervious
            if (zi > 0) { probs[4] += probs[7]; probs[7] = 0; }

            // At zone edges, blend with neighbor zone for softer transitions
            if (zi < 4 && c >= cols - 2) {
              const t = (c - (cols - 2)) / 3;
              const np = zoneData[zi + 1].slice(0, LAB_LC_COUNT);
              for (let k = 0; k < LAB_LC_COUNT; k++) probs[k] = probs[k] * (1 - t) + np[k] * t;
            }
            if (zi > 0 && c < 2) {
              const t = (2 - c) / 3;
              const pp = zoneData[zi - 1].slice(0, LAB_LC_COUNT);
              for (let k = 0; k < LAB_LC_COUNT; k++) probs[k] = probs[k] * (1 - t) + pp[k] * t;
            }

            // Compete: each LC type generates noise, highest (prob + noise) wins
            // Railway (8) only placed by feature overlays, never from noise
            let best = 3, bestS = -Infinity;
            for (let li = 0; li < LAB_LC_COUNT; li++) {
              if (li === 8) continue; // railway only via feature overlays
              if (probs[li] < 0.003) continue;
              const n = fNoise(gc * 0.17, r * 0.17, seed + li * 997);
              const effP = li >= 4 ? probs[li] * 0.25 : probs[li];
              const score = effP + (n - 0.5) * 0.38;
              if (score > bestS) { bestS = score; best = li; }
            }
            // Speckle pass: small chance to flip to a minority type for texture
            // (simulates isolated trees in herb, herb gaps in forest, etc.)
            const dominance = probs[best] || 0;
            const spkRnd = lcHash(gc * 3 + r * 7, r * 11 + gc * 13, seed + 88888);
            if (spkRnd < 0.07 * (0.5 + dominance)) {
              const mins = [];
              probs.forEach((p, i) => { if (i !== best && i !== 8 && p > 0.01) mins.push(i); });
              if (mins.length > 0) best = mins[Math.floor(lcHash(gc, r, seed + 99999) * mins.length)];
            }
            // Brightness variation per cell (slight shade difference)
            const bri = 0.88 + lcHash(gc, r, seed + 77777) * 0.24; // 0.88-1.12
            // For forest cells, assign composition based on zone comp + per-cell noise
            let cellComp = 0;
            if (best === 0) {
              const zComp = zoneData[zi][12];
              cellComp = zComp + (fNoise(gc * 0.25, r * 0.25, seed + 55555) - 0.5) * 0.6;
              cellComp = Math.max(-1, Math.min(1, cellComp));
            }
            // Assign per-cell height and density for forest/shrub types
            let cellHeight = 0, cellDensity = 0;
            if (best === 0) { // Forest
              cellHeight = zoneData[zi][9] + (lcHash(gc + 5, r + 3, seed + 45678) - 0.5) * 20;
              cellDensity = zoneData[zi][11] + (lcHash(gc + 7, r + 11, seed + 56789) - 0.5) * 0.1;
              cellHeight = Math.max(5, Math.round(cellHeight));
              cellDensity = Math.max(0, Math.min(1, cellDensity));
            } else if (best === 1) { // Shrub/Woodland
              cellHeight = 15 + (lcHash(gc + 9, r + 5, seed + 67890) - 0.5) * 10;
              cellHeight = Math.max(5, Math.round(cellHeight));
            } else if (best === 2) { // Shrub
              cellHeight = 6 + (lcHash(gc + 11, r + 7, seed + 78901) - 0.5) * 4;
              cellHeight = Math.max(2, Math.round(cellHeight));
            }
            cells.push({ lc: best, bri, comp: cellComp, height: cellHeight, density: cellDensity });
          }
        }
        zones.push(cells);
        colOff += cols;
      }
      // Apply scenario features (roads, ponds, buildings, etc.)
      const scenId = LAB_SCENARIOS[scenIdx] ? LAB_SCENARIOS[scenIdx].id : '';
      const features = LAB_FEATURES[scenId] || [];
      for (const feat of features) applyFeature(zones, feat, seed, zoneData);
      // Post-process: gravel only allowed in zone 0; convert to impervious elsewhere
      for (let zi = 1; zi < zones.length; zi++) {
        for (const cell of zones[zi]) {
          if (cell.lc === 7) cell.lc = 4; // gravel → impervious
        }
      }

      return zones;
    }

    // Compute per-zone and BID RP scores from scenario + user controls
    // Zone format: [F, SW, S, H, Imp, CoI, Water, Gravel, Rail, height, spth, den, comp]
    function computeLabRP(zoneData, s) {
      const zoneBreakdown = zoneData.map(zd => {
        const forest = zd[0], shrubW = zd[1], shrub = zd[2], herb = zd[3];
        const height = zd[9], spth = zd[10], den = zd[11], comp = zd[12];
        let fRP = 0;
        if (forest > 0.005 && spth > 0) {
          const M = Math.min(height / spth, 1);
          const D = 1 - den;
          const C = Math.max(0, Math.min(1, (comp + 1) / 2));
          const Mc = s.curveH ? applyCurve(M, s.ctH, s.sH) : M;
          const Dc = s.curveD ? applyCurve(D, s.ctD, s.sD) : D;
          const Cc = s.curveC ? applyCurve(C, s.ctC, s.sC) : C;
          const I = Math.max(0, Math.min(1, s.wH * Mc + s.wD * Dc + s.wC * Cc));
          fRP = 55 * (1 - I);
        }
        const scorable = forest + shrubW + shrub + herb;
        if (scorable < 0.01) return { zoneRP: null, fContrib: 0, swContrib: 0, sContrib: 0, hContrib: 0 };
        const fC = (forest * fRP) / scorable;
        const swC = (shrubW * 62) / scorable;
        const sC = (shrub * 73) / scorable;
        const hC = (herb * 88) / scorable;
        return { zoneRP: fC + swC + sC + hC, fContrib: fC, swContrib: swC, sContrib: sC, hContrib: hC };
      });
      const zoneScores = zoneBreakdown.map(z => z.zoneRP);
      let wS = 0, rpW = 0;
      const decay = s.zoneCurve ? (ZONE_CURVES.find(z => z.id === s.zoneCurve) || ZONE_CURVES[0]).w : LAB_DECAY;
      zoneScores.forEach((rp, i) => { if (rp != null) { rpW += rp * decay[i]; wS += decay[i]; } });
      const bidRP = wS > 0 ? rpW / wS : 0;
      return { zoneScores, zoneBreakdown, bidRP, finalRP: Math.min(100, bidRP + LAB_SOLAR + LAB_SLOPE) };
    }

    const ZONE_CURVES = [
      { id: 'moderate', label: 'Moderate (10, 6, 3, 2, 1)',       w: [10, 6, 3, 2, 1] },
      { id: 'squared',  label: 'Squared (10, 3, 1, 0.5, 0.2)',   w: [10, 3, 1, 0.5, 0.2] },
      { id: 'linear',   label: 'Linear (5, 4, 3, 2, 1)',         w: [5, 4, 3, 2, 1] },
    ];

    const LAB_DEFAULT = {
      wH:.35, wD:.35, wC:.30,
      curveH:true, curveD:true, curveC:true,
      ctH:'scurve', ctD:'scurve', ctC:'scurve',
      sH:1.2, sD:1.2, sC:1.5,
      zoneCurve:'moderate',
    };

    // Grid section (scenario picker + landcover grid)
    function LabGridSection({ scen, setScen, scenario, gridZones, hue, side }) {
      const [hover, setHover] = React.useState(null);
      const gridContainerRef = React.useRef(null);
      return (
        <div className="card">
          <div className="card-h">
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span className="pill" style={{ '--c': hue }}>{side}</span>
              <select value={scen} onChange={e => setScen(e.target.value)} aria-label={`${side} scenario`}
                style={{ font: '600 13px var(--font-h)', color: THEME.ink, border: `1px solid ${THEME.line}`, borderRadius: 4, padding: '3px 8px', background: THEME.surface }}>
                {LAB_SCENARIOS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
              </select>
            </div>
            <span style={{ fontSize: 11.5, color: THEME.muted }}>← Channel · Upland →</span>
          </div>
          <div className="card-b">
            <p style={{ fontSize: 12, color: THEME.muted, margin: '0 0 10px', minHeight: 32 }}>{scenario.desc}</p>
            <div ref={gridContainerRef} style={{ display: 'flex', gap: 3, justifyContent: 'center', position: 'relative' }}>
              {gridZones.map((cells, zi) => {
                const cols = GRID_ZONE_COLS[zi];
                return (
                  <div key={zi}>
                    <div style={{
                      display: 'grid',
                      gridTemplateColumns: `repeat(${cols}, 10px)`,
                      gridTemplateRows: `repeat(${GRID_ROWS}, 10px)`,
                      gap: 1,
                      backgroundColor: THEME.line,
                      padding: 1,
                      borderRadius: 3,
                    }}>
                      {cells.map((cell, ci) => (
                        <div key={ci}
                          className={cell.lc > 0 ? lcTextureClass(cell.lc) : ''}
                          onMouseEnter={(e) => {
                            const rect = gridContainerRef.current.getBoundingClientRect();
                            setHover({ cell, x: e.clientX - rect.left, y: e.clientY - rect.top, zi });
                          }}
                          onMouseLeave={() => setHover(null)}
                          style={{
                          width: 10, height: 10, borderRadius: 1,
                          backgroundColor: cell.lc === 0 ? compToColor(cell.comp) : LAB_LC_FILLS[cell.lc],
                          opacity: cell.bri, cursor: 'crosshair',
                        }} />
                      ))}
                    </div>
                    <div className="text-center mt-1" style={{ fontSize: 9, color: THEME.muted }}>
                      {LAB_ZONE_LABELS[zi]}
                    </div>
                  </div>
                );
              })}
              {hover && (
                <div className="tip" style={{ left: Math.min(hover.x + 12, 350), top: hover.y - 60 }}>
                  <b>{LAB_LC_KEYS[hover.cell.lc]}</b>
                  {hover.cell.lc === 0 && <><br />Composition <span className="num">{hover.cell.comp.toFixed(2)}</span> <span style={{ color: THEME.muted }}>({hover.cell.comp > 0.3 ? 'conifer' : hover.cell.comp < -0.3 ? 'deciduous' : 'mixed'})</span></>}
                  {hover.cell.height > 0 && <><br />Tree height <span className="num">{hover.cell.height} ft</span></>}
                  {hover.cell.lc === 0 && <><br />Density <span className="num">{hover.cell.density.toFixed(2)}</span></>}
                  <br /><span style={{ color: THEME.muted }}>{LAB_ZONE_LABELS[hover.zi]}</span>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // Score section (contribution table + RP summary + weight/curve controls)
    function LabControlSection({ st, setSt, scores, hue }) {
      const upd = (k, v) => setSt(prev => ({ ...prev, [k]: v }));
      const wSum = st.wH + st.wD + st.wC;
      const wOk = Math.abs(wSum - 1) < 0.006;

      return (
        <div>
          {/* Zone contributions by cover type */}
          <div className="card mb-3">
            <div className="card-h"><h3>Zone <Term id="rp">Restoration Priority</Term> contributions by cover type</h3></div>
            <div className="card-b">
            <table className="tbl compact">
              <thead>
                <tr>
                  <th>Zone</th>
                  <th className="n">Forest</th>
                  <th className="n">Shrub/Woodland</th>
                  <th className="n">Shrub</th>
                  <th className="n">Herb/Ground</th>
                  <th className="n">Zone Restoration Priority</th>
                </tr>
              </thead>
              <tbody>
                {scores.zoneBreakdown.map((zb, i) => (
                  <tr key={i}>
                    <td>{LAB_ZONE_LABELS[i]}</td>
                    <td className="n">
                      {zb.fContrib > 0.05 ? zb.fContrib.toFixed(1) : '–'}
                    </td>
                    <td className="n">
                      {zb.swContrib > 0.05 ? zb.swContrib.toFixed(1) : '–'}
                    </td>
                    <td className="n">
                      {zb.sContrib > 0.05 ? zb.sContrib.toFixed(1) : '–'}
                    </td>
                    <td className="n">
                      {zb.hContrib > 0.05 ? zb.hContrib.toFixed(1) : '–'}
                    </td>
                    <td className="n">
                      {zb.zoneRP != null ? zb.zoneRP.toFixed(1) : '–'}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          </div>

          {/* Score display + BID RP */}
          <div className="card mb-3">
            <div className="card-h">
              <h3>Restoration Priority</h3>
              <span className="num" style={{ font: '600 28px/1 var(--font-h)', color: hue }}>
                {scores.finalRP.toFixed(2)}
              </span>
            </div>
            <div className="card-b">
            <table className="tbl compact">
              <thead>
                <tr>
                  <th>Zone</th>
                  <th className="n">Restoration Priority</th>
                  <th className="n">Decay weight</th>
                  <th className="n">Contribution</th>
                </tr>
              </thead>
              <tbody>
                {scores.zoneScores.map((rp, i) => (
                  <tr key={i}>
                    <td>{LAB_ZONE_LABELS[i]}</td>
                    <td className="n">{rp != null ? rp.toFixed(1) : '–'}</td>
                    <td className="n">{((ZONE_CURVES.find(z => z.id === st.zoneCurve) || ZONE_CURVES[0]).w[i]).toFixed(1)}</td>
                    <td className="n">
                      {rp != null ? (() => { const dw = (ZONE_CURVES.find(z => z.id === st.zoneCurve) || ZONE_CURVES[0]).w; return (rp * dw[i] / dw.reduce((a,b)=>a+b,0)).toFixed(1); })() : '–'}
                    </td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr>
                  <td>Bank Restoration Priority (weighted)</td>
                  {/* 2dp here and on the total: the two push constants are exact 2dp values, so
                      rounding both ends the same way makes this column visibly add up. At 1dp the
                      base rounded independently of the total and the rows did not sum on screen. */}
                  <td colSpan="3" className="n">{scores.bidRP.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>+ average solar push</td>
                  <td colSpan="3" className="n">+{LAB_SOLAR.toFixed(2)}</td>
                </tr>
                <tr>
                  <td>+ average slope push</td>
                  <td colSpan="3" className="n">+{LAB_SLOPE.toFixed(2)}</td>
                </tr>
                <tr className="tot">
                  <td>Final Restoration Priority</td>
                  <td colSpan="3" className="n" style={{ color: hue }}>
                    {scores.finalRP.toFixed(2)}
                  </td>
                </tr>

    // D1 Forest Successional Stages + Score Distribution (shared charts at bottom of Scoring Lab)
    function LabD1Charts({ data, st }) {
      const sample = (data.sensitivity && data.sensitivity.sample_polygons) || [];
      const d1 = React.useMemo(() => sample.filter(p => p.domain === 'D1_Forest'), [sample]);
      if (!d1.length) return null;

      const STAGE_DIMS = { S: 0.15, M: 0.45, T: 0.75 };
      const DENS_DIMS  = { S: 0.25, D: 0.75 };
      const COMP_DIMS  = { C: 0.80, M: 0.50, D: 0.20 };
      const COMP_LABELS = { C: 'Conifer-dom', M: 'Mixed', D: 'Deciduous-dom' };
      const HEIGHT_LABELS = { S: 'Short', M: 'Medium', T: 'Tall' };
      const DENS_LABELS   = { S: 'Sparse', D: 'Dense' };
      const COMP_ROW_COLORS = { C: COMP_POLES.conifer, M: COMP_POLES.mid, D: COMP_POLES.deciduous };

      const { stagePositions, currentScores, defaultScores } = React.useMemo(() => {
        const defaultScores = d1.map(p => 55 * (1 - (0.35 * p.M + 0.35 * p.D + 0.30 * p.C)));
        const currentScores = d1.map(p => {
          const mVal = st.curveH ? applyCurve(p.M, st.ctH, st.sH) : p.M;
          const dVal = st.curveD ? applyCurve(p.D, st.ctD, st.sD) : p.D;
          const cVal = st.curveC ? applyCurve(p.C, st.ctC, st.sC) : p.C;
          const I = st.wH * mVal + st.wD * dVal + st.wC * cVal;
          return 55 * (1 - Math.max(0, Math.min(1, I)));
        });
        const stages = [];
        for (const [compKey, compVal] of Object.entries(COMP_DIMS)) {
          for (const [htKey, htVal] of Object.entries(STAGE_DIMS)) {
            for (const [denKey, denVal] of Object.entries(DENS_DIMS)) {
              const mC = st.curveH ? applyCurve(htVal, st.ctH, st.sH) : htVal;
              const dC = st.curveD ? applyCurve(denVal, st.ctD, st.sD) : denVal;
              const cC = st.curveC ? applyCurve(compVal, st.ctC, st.sC) : compVal;
              const I = st.wH * mC + st.wD * dC + st.wC * cC;
              const rp = 55 * (1 - Math.max(0, Math.min(1, I)));
              stages.push({ code: compKey + htKey + denKey, rp, comp: compKey, height: htKey, density: denKey,
                label: `${COMP_LABELS[compKey].split('-')[0]}, ${HEIGHT_LABELS[htKey]}, ${DENS_LABELS[denKey]}` });
            }
          }
        }
        return { stagePositions: stages, currentScores, defaultScores };
      }, [d1, st.wH, st.wD, st.wC, st.curveH, st.curveD, st.curveC, st.ctH, st.ctD, st.ctC, st.sH, st.sD, st.sC]);

        const nBins = 28, bw = 2;
        const cur = new Array(nBins).fill(0), def = new Array(nBins).fill(0);
        currentScores.forEach(rp => { const i = Math.min(Math.floor(rp / bw), nBins - 1); if (i >= 0) cur[i]++; });
        defaultScores.forEach(rp => { const i = Math.min(Math.floor(rp / bw), nBins - 1); if (i >= 0) def[i]++; });
        return Array.from({ length: nBins }, (_, i) => ({ bin: i * bw, current: cur[i], default: def[i] }));
      }, [currentScores, defaultScores]);

      const curMean = currentScores.reduce((a, b) => a + b, 0) / (currentScores.length || 1);
      const sorted = currentScores.slice().sort((a, b) => a - b);

                      {stages.map(s => {
                        const pct = Math.max(0, Math.min(100, (s.rp / 55) * 100));
                        return (
                          <div key={s.code} className="absolute group"

                            <div className="px-1.5 py-0.5 rounded text-white font-bold shadow-sm cursor-default"
                              style={{ fontSize: '9px', lineHeight: '15px', backgroundColor: COMP_ROW_COLORS[comp], whiteSpace: 'nowrap' }}>
                              {s.code}
                            </div>
                            <div className="hidden group-hover:block tip" style={{ position: 'absolute', bottom: '100%', left: '50%', transform: 'translateX(-50%)', marginBottom: 4, zIndex: 10 }}>
                              {s.label} - RP {s.rp.toFixed(1)}
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              );
            })}
            <div className="flex text-xs mt-1" style={{ paddingLeft: 'calc(0.75rem + 7rem + 0.5rem)', color: THEME.muted }}>
              <span className="flex-1 text-left">0 (intact)</span>
              <span className="flex-1 text-center">~27</span>
              <span className="flex-1 text-right">55 (degraded)</span>
            </div>
            </div>
          </div>

          {/* D1 Score Distribution */}
          <SectionTitle>Score distribution, forest polygons</SectionTitle>
          <div className="card mb-4">
            <div className="card-b">
            <div className="flex items-center gap-6 mb-3 text-sm">
              <span style={{ color: THEME.ink2 }}>
                Mean Restoration Priority: <strong style={{ color: THEME.accentInk }}>{curMean.toFixed(1)}</strong>
                <span className="text-xs ml-1">
                  ({curMean < defMean ? '' : '+'}{(curMean - defMean).toFixed(1)} vs default)
                </span>
              </span>
              <span style={{ color: THEME.ink2 }}>
                Median: <strong style={{ color: THEME.accentInk }}>{curMedian.toFixed(1)}</strong>
              </span>
              <span style={{ color: THEME.ink2 }}>
                n = {fmtN(currentScores.length)} D1 polygons
